version: 2
updates:
  # npm-зависимости Astro-приложения (web/). Minor+patch батчим в один PR, чтобы не шумело.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The merge gate needs exactly one matrix label; dependency bumps do not touch UI.
    labels: [dependencies, javascript, gate/matrix-not-needed]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # версию бренд-кита бампаем вручную (приватный GitHub Packages)
      - dependency-name: "@omnisgm-app/brand"
      # мажор typescript снять, когда @astrojs/check объявит peer `typescript ^7` (#357)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # версии GitHub Actions — и в workflow'ах, и внутри наших composite-действий.
  # `directory: /` сканирует только .github/workflows/** и корневой action.yml, а пины
  # actions/setup-node и setup-python с #287 живут в .github/actions/setup-web — без
  # второго пути dependabot молча перестал бы их бампать (ревью #300).
  - package-ecosystem: github-actions
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: weekly
    labels: [dependencies, github_actions, gate/matrix-not-needed]

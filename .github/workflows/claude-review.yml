name: Claude auto-review

# КОПИЯ единого шаблона: источник правды — OmnisGM-App/claude-plugins
# .github/workflows/claude-review.yml (reusable). На Free-плане GitHub не даёт звать
# private reusable из другой репы (проверено экспериментом 2026-09-06: same-repo ок,
# cross-repo startup_failure) — потому в репах живут копии; с Team-планом копию можно
# заменить тонким вызовом `uses: …@master` + `secrets: inherit`.

# Авто-ревью каждого коммита PR (#443-процесс, скилл omnisgm-review из плагина omnisgm).
# Новый пуш в PR отменяет незаконченное ревью и запускает свежее (concurrency ниже).
# Работает на личной подписке владельца: CLAUDE_CODE_OAUTH_TOKEN из `claude setup-token`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Один прогон на PR: прилетел новый коммит — текущее ревью стопается и стартует заново.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # Полная история: ревью сверяет опоры по базовой ветке (git diff base...head).
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        env:
          GH_PLUGINS_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: false
          # Маркетплейс приватный — клонится fine-grained PAT-ом (contents: read
          # на OmnisGM-App/claude-plugins); секрет в URL маскируется логами Actions.
          plugin_marketplaces: |
            https://x-access-token:${{ secrets.CLAUDE_PLUGINS_TOKEN }}@github.com/OmnisGM-App/claude-plugins.git
          plugins: |
            omnisgm@omnisgm
          claude_args: |
            --max-turns 120
            --allowedTools "Task,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(grep:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(python3:*),Bash(diff:*),Bash(sort:*),Bash(uniq:*),Bash(find:*)"
          prompt: |
            Ты — ГЛАВНЫЙ ЦИКЛ мультиагентного CI-ревью PR #${{ github.event.pull_request.number }}
            в ${{ github.repository }}. Работа строится по скиллу omnisgm-review установленного
            плагина omnisgm: найди его каталог (`ls ~/.claude/plugins/`; внутри —
            skills/omnisgm-review/SKILL.md и references/agents.md) и прочитай оба файла.

            КОНВЕЙЕР (адаптация мультиагентного прогона скилла к CI):
            1. Контекст: рабочая копия — вычекнутая ветка PR в $GITHUB_WORKSPACE; дифф —
               `git diff origin/${{ github.base_ref }}...HEAD`; описание PR и связанные ишьи —
               через gh. Сложи всё в /tmp/review/ (00-pr.md, 01-diff.patch, 03-issue-*.md).
            2. ВОСЕМЬ субагентов Task ПАРАЛЛЕЛЬНО (одним сообщением): A process, B regression,
               C bugs, D architecture, E tests, G comments, H security, F hunter («Найди ошибки»,
               промт F не расширять). Каждому дай: CI-шапку (ниже) + его профильный промт
               ДОСЛОВНО из references/agents.md + пути контекста. Результаты — /tmp/review/1?-*.md.
            3. Валидатор-скептик (Task, промт V из agents.md): опровергает каждую находку по
               рабочей копии, вердикты CONFIRMED/REFUTED/PLAUSIBLE, дубли слить →
               /tmp/review/80-validation.md.
            4. Сборка по формату §5 SKILL.md: тело — шапка-вердикт в одну-две строки
               (голова, итог, «+N инлайнов»); находка на строку диффа — ТОЛЬКО инлайном с
               ПОЛНЫМ текстом (заголовок с тяжестью, доказательство, почему, предложение),
               из тела целиком убирается; REFUTED не публикуется.
            5. Публикация: ОДИН review-объект через
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews`
               (event=COMMENT, body + comments[] с path/line/side). Если после валидации находок
               нет — короткое ревью «CI-конвейер: находок нет» с числом агентов и головой.

            CI-ШАПКА для каждого субагента (вместо локальной шапки agents.md):
            - Рабочая копия: $GITHUB_WORKSPACE (ветка PR уже вычекнута, origin/${{ github.base_ref }} доступен).
              Опоры проверяй грепом и чтением файлов. НЕ переключать ветки, не писать в git.
            - Прогоны РАЗРЕШЕНЫ только лёгкие: python3-гейты из .github/scripts (≤2 мин),
              diff/grep-анализ. ЗАПРЕЩЕНО: npm install/build/test, эмуляторы, браузеры,
              сеть кроме gh. Мутации данных — только в копии под /tmp, не в $GITHUB_WORKSPACE.
            - Каждая находка: доказательство (файл:строка / вывод), тяжесть (❗/среднее/ремарка),
              уверенность, «внесено диффом / пре-существует». НЕ находки: пре-существующее,
              вкусовое, «потенциальное» без конкретного входа, ловимое линтером.
            - Результат — файл /tmp/review/NN-key.md; нет находок — «чисто» + что проверил.

            ЖЁСТКИЕ РАМКИ: НЕ одобрять (no APPROVE), НЕ давать LGTM, НЕ мёржить, НЕ править код —
            финальный гейт за живой сессией владельца. Пиши по-русски. Если дифф тривиален
            (типо-правка, ≤5 строк без логики) — конвейер не разворачивай: одиночное ревью
            одним проходом, честно скажи это в шапке-вердикте.

            ПОСЛЕ публикации — цикл улучшения: наблюдение (что мешало конвейеру в CI, ложные
            срабатывания, недостающий класс) — одним комментом в журнал
            `GH_TOKEN=$GH_PLUGINS_TOKEN gh issue comment 1 --repo OmnisGM-App/claude-plugins`
            по формату из тела ишьи. Нечего сказать — не пиши.

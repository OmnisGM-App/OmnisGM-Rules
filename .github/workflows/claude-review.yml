name: Claude auto-review

# A COPY of the shared template: source of truth — OmnisGM-App/claude-plugins
# .github/workflows/claude-review.yml (reusable). On the GitHub Free plan a private reusable
# workflow cannot be called from another repo (verified by experiment 2026-09-06: same-repo ok,
# cross-repo startup_failure) — so the repos keep copies; with the Team plan the copy can be
# replaced by a thin call `uses: …@master` + `secrets: inherit`.

# Auto-review of every PR commit (#443 process, skill omnisgm-review from the omnisgm plugin).
# A new push to the PR does NOT start a review (v2.42: one auto run per PR); merge/close cancels the running one.
# Runs on the owner's personal subscription: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`.
# v2.27 (stage 1 of the token-saving plan, 2026-09-16): REPO_DIR — `${{ github.workspace }}`
# (the literal `$GITHUB_WORKSPACE` was not expanded: 6 denials in a row in run 35097394123);
# `--model opus` explicitly; `npm run test:*` in the allowlist (gates test:dice/test:rules/test:css);
# plugin path into the prompt from the Prepare step (Glob — fallback). Plugin hooks (SubagentStop,
# PreToolUse) arrive with plugin 1.7.0 by themselves.
# v2.47 (2026-10-07): journal — run marker against a duplicate on a GitHub error, text to the log
#   on failure, no pause after the last attempt (review of Table PR #849).
# v2.46 (2026-10-06): journal step — continue-on-error + 3 attempts: a GitHub failure on it
#   no longer paints the job red after a published review (run 37520167275).
# v2.45 (2026-09-29): a symbols.py failure is written as a line into INDEX.md (lenses see the cause, not
# a bare Read error); the prose "with a single git grep" removed — grep goes per name (review Table#742).
# v2.44 (2026-09-29): Prepare builds 07-symbols.md — exports touched by the diff and their
# callers at the head, once per run by a script (scripts/symbols.py); lenses read it
# instead of their own probes on the same names (rubric TOK-7/SCOPE-4).
# v2.43 (2026-09-29): models PINNED by full IDs and effort set. Aliases drift with the CLI
# version that claude-code-action installs on every run: `opus` became Opus 5.5 in 2.1.280
# (for us — 23.09 midday), `sonnet` became Sonnet 5.5 in 2.1.284 (28.09 evening) — models
# changed without our decision. Opus 5.5 has default effort `medium` (Opus 5 had `high`), and since
# 23.09 the main loop and lenses C/F/V silently dropped a step: median $/run 14.9 → 5.6,
# mediums per review 4.4 → 1.9. Hence the main loop — `--model claude-opus-5-5` and `--effort high`,
# and the aliases `opus`/`sonnet` in Agent calls (lenses) — via environment variables of the step (see env).
# Changing model/effort — only with a replay measurement (workflow_dispatch on the same PR).
# v2.42 (2026-09-22): auto-review ENABLED — exactly ONE automatic run per PR (owner's
# decision): pull_request only opened/ready_for_review (+closed for cancellation), no synchronize/
# reopened. Fix rounds and repeats — via the workflow_dispatch button (`force` for the full pipeline).
# v2.41 (2026-09-22, audit 8): Prepare lays out the diff files at the PR head in $OUT/src/ (agents
# read with Read, not `git show` — up to 115 extra calls per run) and runs a baseline `tsc --noEmit`
# per tsconfig → 06-runfacts.md; the dump chronicle is attributed per agent ([who]).
# v2.40 (2026-09-22): header without "+N inlines" (owner's decision: how many of the findings
# are inlines — irrelevant) and correct forms "1 среднее / 2 ремарки" (Russian plurals in the review body).
# v2.39 (2026-09-22): `force` input on the button — full pipeline even on an already reviewed head
# (iter_state --force → mode=pipeline); needed for repeats and measurements on a live PR.
# v2.38 (2026-09-22): DISPATCH ≠ REPLAY. The button on an OPEN PR — a real review round (the workflow
# is manual since v2.34): the merge commit is recreated as before, but the "🔁 Реплей" (replay) mark and `--replay` for
# iter_state — only when the PR is not OPEN (merged/closed). Run 35724815885 marked live review #630
# as a replay.
# v2.37 (2026-09-22): transcript dump counts per agent (parent_tool_use_id): tool calls,
# denials, usage tokens — the measurement sees the price of each lens, not only the sum.
# v2.36 (2026-09-22): marketplace for the action — ALWAYS the local clone from RUNNER_TEMP (it exists
# since v2.33 anyway); the URL variant removed. Reason: on a persistent runner ~/.claude/settings.json
# remembers the marketplace declaration, and changing the source kind (path ↔ URL) breaks `marketplace add`
# ("its network source differs from the one declared", run 35719739780). The Purge step removes
# the old declaration from settings.json.
# v2.35 (2026-09-22, token audit wave 7): Prepare computes the ITERATION MODE (iter_state.py →
# `ITER:` line in INDEX.md + fix-diff.patch), installs dependencies (`npm ci`) and builds the workspace
# `shared` — environment facts in 06-runfacts.md; the main loop no longer touches 02-pr-comments.md
# or npm ci. `Bash(npm ci:*)` removed from the allowlist.
# v2.34 (2026-09-22): workflow_dispatch only — the PR auto-trigger commented out (see `on:`).
# v2.33 (2026-09-22, token audit wave 6): the run directory is unique — OUT=/tmp/review/<branch>-<UTC>
# (two PRs on one self-hosted runner no longer overwrite each other; leftovers older than 12 h are cleaned
# by age). Marketplace clone — ALWAYS, before Prepare: its scripts cut the diff into slices, build
# the digest and check the head/file list BEFORE Claude (4–6 opus turns of the main loop moved to bash);
# the check result — a `RECALC:` line in INDEX.md. Skill path into the prompt — always from this clone.
# v2.32 (2026-09-22): `packages: read` + NODE_AUTH_TOKEN on the job — `npm ci` pulls private
# @omnisgm-app/* from GitHub Packages; without the token replay 35692325404 ran without tsc/units/mutations.
# v2.31 (2026-09-22): `plugin_ref` input on workflow_dispatch — measuring a plugin branch BEFORE merging into
# master: the marketplace clone on that branch is placed in $RUNNER_TEMP and handed to the action
# as a LOCAL PATH (plugin_marketplaces accepts a path), the skill path into the prompt — from there too.
# Empty (and any PR event) — the previous master clone by URL.
# v2.30: allowlist `Bash(npm run:*)` instead of `npm run test:*` — the colon in the rule broke the
# match, `npm run test:css` was cut (replay 35112973775); build/lint for agents is cut by the plugin hook.
# v2.29: transcript dump prints the model of the Agent dispatch. Plugin 1.7.2: the hint hook no longer
# cuts `npm ci` for the main loop (replay 35110978839 passed without node_modules).
# v2.28: workflow_dispatch with a PR number — a replay run on any (incl. merged) PR for
# cost measurement: Prepare recreates the merge commit from the PR head and the merge parent, the review
# body is marked "replay". PR-event conditions do not apply on dispatch.
# v2.26: plugin directory lookup — Glob, not ls (ls ~/.claude/plugins is blocked by policy).
# v2.25: CLAUDE_PLUGINS_TOKEN (fine-grained PAT for claude-plugins) is needed by the product repos —
# to clone the private marketplace and write the journal to claude-plugins#1. In the claude-plugins repo
# itself the secret does not exist and is not needed: github.token reads its own repo and writes to its own issues,
# hence everywhere `secrets.CLAUDE_PLUGINS_TOKEN || github.token` (empty secret → fallback).
# Before that all review runs in claude-plugins failed with "Invalid username or token" (7/14/16.09).
on:
  # v2.42 (2026-09-22): ONE auto run per PR — opened (non-draft) OR ready_for_review (a draft
  # on opened is skipped by the job condition, so there is never a second run). synchronize and
  # reopened are NOT listened to: every new push is not a new bill, a fix round is started by the owner
  # via the button. WITHOUT edited (2026-09-12): editing the description ran the skip job and the grey "Skipped"
  # overwrote the green check. closed — a trick: a run in the same concurrency group cancels the running
  # review on PR merge/close and itself ends as skipped.
  pull_request:
    types: [opened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number for a replay run (may be merged)'
        required: true
        type: string
      plugin_ref:
        description: 'claude-plugins branch/tag to measure (empty = master)'
        required: false
        type: string
        default: ''
      force:
        description: 'Full pipeline even if the head is already reviewed'
        type: boolean
        default: false

concurrency:
  # One group per PR: closed (or the button) cancels the current review.
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Review only PRs into the default branch (dev/master/main — each repo has its own): a stacked PR
    # waits for a push after the base retarget. Drafts and dependabot — skip. closed is not reviewed
    # (it only cancels the group).
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch )
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      packages: read   # installing private @omnisgm-app/* from GitHub Packages (npm ci)
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # v2.32: for npm ci in agent sandboxes
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          # Full history: the review checks anchors against the base branch (git diff base...head).
          fetch-depth: 0

      # Self-sufficiency on self-hosted: Node 22 (jsdom/undici require >=22)
      # and gh CLI (on self-hosted it is not in PATH). On ubuntu-latest both steps are
      # almost no-op: node is installed from cache, gh is already there.
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ensure gh CLI in PATH
        shell: bash
        run: |
          command -v gh >/dev/null && { gh --version | head -1; exit 0; }
          v=$(curl -s https://api.github.com/repos/cli/cli/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)
          case "$(uname -m)" in x86_64) a=amd64;; aarch64|arm64) a=arm64;; *) echo "no gh build for $(uname -m)"; exit 1;; esac
          curl -sL "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_${a}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_${a}/bin" >> "$GITHUB_PATH"

      # v2.33: marketplace clone ALWAYS and BEFORE Prepare — its scripts (slice_diff, digest_context)
      # are needed by the Prepare step, and the action installs the plugin later. plugin_ref (v2.31) picks the branch;
      # empty — master. The clone is fresh every run (self-hosted is persistent).
      - name: Fetch plugin scripts
        shell: bash
        env:
          GH_PLUGINS_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN || github.token }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          rm -rf "$RUNNER_TEMP/omnisgm-marketplace"
          git clone -q --depth 1 --branch "${PLUGIN_REF:-master}" "https://x-access-token:${GH_PLUGINS_TOKEN}@github.com/OmnisGM-App/claude-plugins.git" "$RUNNER_TEMP/omnisgm-marketplace"
          echo "plugin from branch ${PLUGIN_REF:-master}: $(git -C "$RUNNER_TEMP/omnisgm-marketplace" rev-parse --short HEAD), version $(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/omnisgm-marketplace/plugins/omnisgm/.claude-plugin/plugin.json'))['version'])")"

      # Saving Claude turns: the PR context is captured by a script BEFORE the start (analogous to
      # fetch_pr.sh of the local pipeline) — Claude starts right away with reading files.
      # v2.33: also here — slicing, digest and the head/file list check.
      - name: Prepare review context
        id: prep
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEADREF: ${{ github.head_ref }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
        run: |
          REPLAY=""
          if [ -n "$DISPATCH" ]; then
            # v2.38: replay = the button on a NON-open PR; on an open one it is a regular round.
            [ "$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)" = "OPEN" ] || REPLAY=1
            # Replay: working copy = default branch; we recreate what the PR event gives —
            # a merge commit with the PR head as the second parent, base = the merge parent (merged PR)
            # or the live base branch. Branch names go into remote-refs so that `origin/<base>` and
            # `origin/<headref>` from ci-pipeline.md work as usual.
            read -r headref baseref merged headsha < <(gh pr view "$PR" --repo "$REPO" --json headRefName,baseRefName,mergeCommit,headRefOid --jq '"\(.headRefName) \(.baseRefName) \(.mergeCommit.oid // "-") \(.headRefOid)"')
            git fetch -q origin "refs/pull/$PR/head:refs/remotes/origin/$headref"
            if [ "$merged" != "-" ]; then basesha=$(git rev-parse "$merged^"); else basesha=$(git rev-parse "origin/$baseref"); fi
            git update-ref refs/remotes/origin/replay-base "$basesha"
            git -c user.email=ci@omnisgm -c user.name=replay checkout -q "$basesha"
            git -c user.email=ci@omnisgm -c user.name=replay merge -q --no-ff --no-edit "origin/$headref"
            BASE=replay-base; HEADREF=$headref
            echo "replay of PR #$PR: head $headsha, base $basesha ($baseref), merged=$merged"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"; echo "headref=$HEADREF" >> "$GITHUB_OUTPUT"; echo "replay=$REPLAY" >> "$GITHUB_OUTPUT"
          # v2.33: the run directory is unique — branch + UTC stamp. Two PRs of one repo run
          # in parallel (concurrency group per PR); on a persistent self-hosted runner a
          # shared /tmp/review would overwrite the neighbour's context and reports. Old runs are cleaned by
          # age (a cancelled run does not execute its final step — the Table#529/v2.24 case);
          # the globs /tmp/*-sandbox and *.tar — legacy of the prompt before 1.6.13.
          OUT="/tmp/review/$(printf '%s' "$HEADREF" | tr -c 'A-Za-z0-9._-' '_')-$(date -u +%Y%m%d-%H%M%S)"
          mkdir -p /tmp/review
          find /tmp/review -mindepth 1 -maxdepth 1 -mmin +720 -exec rm -rf {} + 2>/dev/null || true
          rm -rf /tmp/wt /tmp/*-sandbox /tmp/*-src.tar /tmp/*-nm.tar
          mkdir -p "$OUT"; echo "out=$OUT" >> "$GITHUB_OUTPUT"; echo "run directory: $OUT"
          gh pr view "$PR" --repo "$REPO" --json number,title,body,baseRefName,headRefOid,additions,deletions,changedFiles --jq '"# PR #\(.number): \(.title)\n\nhead: \(.headRefOid) | base: \(.baseRefName) | +\(.additions) -\(.deletions) | files: \(.changedFiles)\n\n\(.body)"' > $OUT/00-pr.md
          git diff "origin/${BASE}...HEAD" > $OUT/01-diff.patch
          gh pr view "$PR" --repo "$REPO" --json comments,reviews --jq '([.comments[] | "--- comment \(.author.login) \(.createdAt)\n\(.body)\n"] + [.reviews[] | select(.body != "") | "--- review \(.author.login) \(.state) \(.submittedAt)\n\(.body)\n"]) | join("\n")' > $OUT/02-pr-comments.md || true
          git diff --name-only "origin/${BASE}...HEAD" > $OUT/04-files.txt
          for n in $(grep -oE '#[0-9]+' $OUT/00-pr.md | tr -d '#' | sort -un | head -5); do
            [ "$n" = "$PR" ] && continue
            gh issue view "$n" --repo "$REPO" --json number,title,body,state,comments --jq '"# Issue #\(.number) (\(.state)): \(.title)\n\n\(.body)\n\n" + ([.comments[] | "--- comment \(.author.login)\n\(.body)\n\n"] | join(""))' > "$OUT/03-issue-$n.md" 2>/dev/null || rm -f "$OUT/03-issue-$n.md"
          done
          { echo "# Run INDEX (context prepared by CI)"; echo; wc -l $OUT/*.md $OUT/*.patch $OUT/*.txt 2>/dev/null; } > $OUT/INDEX.md
          # v2.33: head and file list check — deterministic, done here, not in Claude.
          # HEAD of a pull_request event (and of a replay) is the merge commit, PR head = HEAD^2 (Table#529).
          # File list: for stacked PRs after a base fast-forward the `...HEAD` diff mixes in the
          # neighbour (News#86), `gh pr diff` gets stuck on the old merge-base (Rules#309) — the truth is
          # `origin/<base>...HEAD^2`; a discrepancy is recomputed and announced by a RECALC: line.
          SKILL="$RUNNER_TEMP/omnisgm-marketplace/plugins/omnisgm/skills/omnisgm-review"
          headpr=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          headwc=$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)
          [ "$headpr" = "$headwc" ] || echo "RECALC: working copy head $headwc ≠ PR head $headpr — the context may be stale (Table#529), add a caveat to the review header" >> "$OUT/INDEX.md"
          { git diff --name-only "origin/${BASE}...HEAD^2" 2>/dev/null || true; } | sort > "$OUT/.files-truth"
          if [ -s "$OUT/.files-truth" ] && ! diff -q <(sort "$OUT/04-files.txt") "$OUT/.files-truth" >/dev/null; then
            git diff --output="$OUT/01-diff.patch" "origin/${BASE}...HEAD^2"
            cp "$OUT/.files-truth" "$OUT/04-files.txt"
            echo "RECALC: file list recomputed by origin/${BASE}...HEAD^2 (the diff against the merge commit diverged — stacked PR or base shift), add a caveat to the review header" >> "$OUT/INDEX.md"
          fi
          { gh pr diff "$PR" --repo "$REPO" --name-only 2>/dev/null || true; } | sort > "$OUT/.files-gh"
          if [ -s "$OUT/.files-gh" ] && ! diff -q "$OUT/.files-gh" "$OUT/.files-truth" >/dev/null; then
            echo "RECALC: gh pr diff --name-only diverges from origin/${BASE}...HEAD^2 — working by git (Rules#309), add a caveat to the review header" >> "$OUT/INDEX.md"
          fi
          rm -f "$OUT/.files-truth" "$OUT/.files-gh"
          python3 "$SKILL/scripts/slice_diff.py" "$OUT"
          python3 "$SKILL/scripts/digest_context.py" "$OUT"
          # v2.44: exports touched by the diff and their callers at the head — once per run
          # by a script instead of probes by each lens (07-symbols.md; rubric TOK-7/SCOPE-4).
          python3 "$SKILL/scripts/symbols.py" "$OUT" "$PWD" "$headwc" \
            || echo "07-symbols.md: not built (symbols.py exit $?) — lenses run their own probes" | tee -a "$OUT/INDEX.md"
          # v2.41: text files of the diff at the PR head — once in $OUT/src/ (audit 8, [1]).
          # Deleted and binary files are skipped (absent at the head / images are outside the review).
          mkdir -p "$OUT/src"; nsrc=0
          git ls-tree -r --name-only "$headwc" > "$OUT/.head-files"
          grep -Fxf "$OUT/.head-files" "$OUT/04-files.txt" | grep -Eiv '\.(png|jpe?g|gif|webp|ico|woff2?|ttf|otf|pdf|zip)$' > "$OUT/.src-list" || true
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            mkdir -p "$OUT/src/$(dirname "$p")"
            git show "$headwc:$p" > "$OUT/src/$p" && nsrc=$((nsrc+1))
          done < "$OUT/.src-list"
          rm -f "$OUT/.head-files" "$OUT/.src-list"
          echo "src/: $nsrc diff files at the PR head (text, existing at the head)" >> "$OUT/INDEX.md"
          # v2.35: iteration mode — from the last published review and git, not from the model
          # reading 02-pr-comments.md (stop rule, fix-diff, clean base merge — all there).
          gh pr view "$PR" --repo "$REPO" --json reviews > "$OUT/.reviews.json" || echo '{"reviews":[]}' > "$OUT/.reviews.json"
          python3 "$SKILL/scripts/iter_state.py" "$OUT" "$PWD" "$BASE" "$headwc" $( [ -n "$REPLAY" ] && echo --replay ) $( [ -n "$FORCE" ] && echo --force )
          rm -f "$OUT/.reviews.json"
          # v2.35: dependencies and the shared workspace build — deterministic shell, not a model turn.
          # Environment facts of the CURRENT run — only in 06-runfacts.md (history in 02/05 is not facts).
          : > "$OUT/06-runfacts.md"
          if [ -f package.json ]; then
            ci=0; npm ci > "$OUT/.npm-ci.log" 2>&1 || ci=$?
            echo "npm ci: exit $ci" >> "$OUT/06-runfacts.md"; tail -3 "$OUT/.npm-ci.log"
            if [ "$ci" = 0 ] && [ -f shared/package.json ]; then
              b=0; npm run build --workspace=shared > "$OUT/.shared-build.log" 2>&1 || b=$?
              if [ "$b" = 0 ]; then echo "shared/dist: built" >> "$OUT/06-runfacts.md"; else echo "shared/dist: NOT built (exit $b)" >> "$OUT/06-runfacts.md"; tail -5 "$OUT/.shared-build.log"; fi
            fi
            # v2.41: baseline typecheck once per run — agents take the fact from 06-runfacts.md (audit 8, [3]).
            if [ "$ci" = 0 ]; then
              for cfg in tsconfig.json frontend/tsconfig.json; do
                [ -f "$cfg" ] || continue
                t=0; npx tsc --noEmit -p "$cfg" > "$OUT/.tsc.log" 2>&1 || t=$?
                if [ "$t" = 0 ]; then echo "tsc $cfg: exit 0" >> "$OUT/06-runfacts.md"; else echo "tsc $cfg: exit $t — $(tail -3 "$OUT/.tsc.log" | tr '\n' ' ')" >> "$OUT/06-runfacts.md"; fi
              done
              rm -f "$OUT/.tsc.log"
            fi
            rm -f "$OUT/.npm-ci.log" "$OUT/.shared-build.log"
          else
            echo "npm ci: not needed (no package.json)" >> "$OUT/06-runfacts.md"
          fi
          cat "$OUT/06-runfacts.md"
          ls -la "$OUT/" && wc -l "$OUT/01-diff.patch" && { grep '^RECALC:\|^ITER:' "$OUT/INDEX.md" || true; }
          # v2.33: skill path for the prompt — always from the marketplace clone (step Fetch plugin scripts);
          # the same master the action installs, or the plugin_ref branch.
          echo "skill=$SKILL" >> "$GITHUB_OUTPUT"

      # v2.22: a persistent self-hosted runner does NOT update the plugin — claude-code-action
      # sees "already installed" and skips the install, the review runs on an ancient cache
      # (Table run 34631615126 worked on 1.2.0 without ci-pipeline.md and failed without publishing).
      # We wipe the plugin state entirely — the action installs fresh master anew every run.
      # On ephemeral ubuntu-latest the directory does not exist — the step is a no-op.
      - name: Purge stale plugin cache (self-hosted)
        shell: bash
        run: |
          rm -rf ~/.claude/plugins
          # v2.36: the marketplace declaration lives in settings.json, not in plugins/ — remove it too.
          [ -f ~/.claude/settings.json ] && python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.claude/settings.json")
          d = json.load(open(p))
          d.get("extraKnownMarketplaces", {}).pop("omnisgm", None)
          d.get("enabledPlugins", {}).pop("omnisgm@omnisgm", None)
          json.dump(d, open(p, "w"), ensure_ascii=False, indent=2)
          PY
          true

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        env:
          GH_PLUGINS_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN || github.token }}
          # v2.43: the aliases `opus`/`sonnet` in Agent calls resolve via these variables,
          # not via the CLI version on the runner.
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5-5
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: false
          # The marketplace is private — cloned with a fine-grained PAT (contents: read
          # on OmnisGM-App/claude-plugins); the secret in the URL is masked by Actions logs.
          # v2.36: always the local clone (step Fetch plugin scripts: master or the plugin_ref branch).
          plugin_marketplaces: ${{ runner.temp }}/omnisgm-marketplace
          plugins: |
            omnisgm@omnisgm
          claude_args: |
            --max-turns 200
            --model claude-opus-5-5
            --effort high
            --add-dir /tmp
            --allowedTools "Task,Read,Write,Edit,Glob,Grep,Bash(echo:*),Bash(sed:*),Bash(awk:*),Bash(cut:*),Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(gh issue view:*),Bash(grep:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(python3:*),Bash(diff:*),Bash(sort:*),Bash(uniq:*),Bash(find:*),Bash(npm run:*),Bash(npx vitest:*),Bash(npx tsc:*),Bash(node:*),Bash(mkdir:*),Bash(cp:*),Bash(tar:*)"
          prompt: |
            You are the MAIN LOOP of the multi-agent CI review of a PR. Skill directory:
            ${{ steps.prep.outputs.skill }} — read TWO files from there with the Read tool:
            references/ci-pipeline.md (the whole pipeline and the rules — follow them) and
            references/triage.md (agent composition and models). Agent prompts live in
            references/agents/ — the agent reads them ITSELF, you do not read or embed them.
            The review is posted to the PR in Russian. Write in Russian.

            RUN: PR=#${{ github.event.pull_request.number || inputs.pr }}
            REPO=${{ github.repository }} BASE=${{ steps.prep.outputs.base }}
            HEADREF=${{ steps.prep.outputs.headref }}
            REPO_DIR=${{ github.workspace }} OUT=${{ steps.prep.outputs.out }}

      - name: Publish review
        if: always()
        env:
          RUN_OUT: ${{ steps.prep.outputs.out }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REPLAY: ${{ steps.prep.outputs.replay }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          rd = os.environ["RUN_OUT"]
          # The review body is assembled DETERMINISTICALLY from 90-verdict.json — the model does not write the body
          # and cannot append anything to it (the "too much text" saga v2.8/2.12/2.16 is closed by the form).
          # The body strings below are Russian on purpose: the review posted to the PR is in Russian.
          vf, bf = f"{rd}/90-verdict.json", f"{rd}/90-final-review.md"
          if os.path.exists(vf):
              v = json.load(open(vf))
              head = str(v.get("head", ""))[:7]
              c = v.get("counts") or {}
              major, med, rem = int(c.get("major") or 0), int(c.get("medium") or 0), int(c.get("remark") or 0)
              mode = v.get("mode", "pipeline")
              total = major + med + rem
              if total == 0:
                  if mode == "fix-round":
                      body = (f"Находок нет. Голова `{head}`, фикс-раунд после `{str(v.get('prev_head',''))[:7]}`: "
                              f"закрыты все {v.get('prev_total', v.get('prev_closed', 0))} находок прошлого ревью.")
                  elif mode == "single":
                      body = f"Находок нет. Голова `{head}`, одиночное ревью."
                  else:
                      body = f"Находок нет. Голова `{head}`, агентов: {v.get('agents', 0)}."
              else:
                  def pl(n, one, few, many):
                      n10, n100 = n % 10, n % 100
                      return one if n10 == 1 and n100 != 11 else few if 2 <= n10 <= 4 and not 12 <= n100 <= 14 else many
                  parts = [f"{major} ❗"] * (major > 0) + [f"{med} {pl(med, 'среднее', 'средних', 'средних')}"] * (med > 0) + [f"{rem} {pl(rem, 'ремарка', 'ремарки', 'ремарок')}"] * (rem > 0)
                  hdr = f"Голова `{head}`"
                  if mode == "fix-round":
                      hdr += f", фикс-раунд после `{str(v.get('prev_head',''))[:7]}`"
                  elif mode == "single":
                      hdr += ", одиночное ревью"
                  else:
                      hdr += f", агентов: {v.get('agents', 0)}"
                      if v.get("triage_skips"):
                          hdr += f" (триаж: {v['triage_skips']})"
                  body = hdr + ". Находки: " + " / ".join(parts) + "."
              # 90-body-findings.md is appended even with zero findings: it holds
              # the caveat line of the single-pass degradation (ci-pipeline contract).
              bff = f"{rd}/90-body-findings.md"
              if os.path.exists(bff):
                  body += "\n\n" + open(bff).read().strip()
          elif os.path.exists(bf):
              # Degradation fallback: the free-form body of a single pass under the old contract.
              print("::warning::no 90-verdict.json — published the fallback 90-final-review.md (contract degradation)")
              body = open(bf).read().strip()
          else:
              print("::error::Claude did not produce 90-verdict.json — review not published")
              sys.exit(1)
          try:
              inl = json.load(open(f"{rd}/90-inline.json"))
              assert isinstance(inl, list)
          except Exception:
              inl = []
          # valid line numbers from the diff: RIGHT — the after-version, LEFT — the before-version
          right, left, cur, oldp = {}, {}, None, None
          for ln in open(f"{rd}/01-diff.patch", encoding="utf-8", errors="replace"):
              m = re.match(r"--- a/(.*)", ln)
              if m:
                  oldp = m.group(1).strip(); continue
              m = re.match(r"\+\+\+ (?:b/(.*)|(/dev/null))", ln)
              if m:
                  # deleted file: "+++ /dev/null" — the path is taken from "--- a/…"
                  cur = (m.group(1) or oldp or "").strip(); right.setdefault(cur, set()); left.setdefault(cur, set()); continue
              m = re.match(r"@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", ln)
              if m and cur:
                  a, b = int(m.group(1)), int(m.group(2) or 1)
                  c, d = int(m.group(3)), int(m.group(4) or 1)
                  left[cur].update(range(a, a + b)); right[cur].update(range(c, c + d))
          good, moved = [], []
          for cm in inl:
              p_, l_, side = cm.get("path"), cm.get("line"), (cm.get("side") or "RIGHT")
              ok = (side == "RIGHT" and l_ in right.get(p_, ())) or (side == "LEFT" and l_ in left.get(p_, ()))
              (good if ok else moved).append(cm)
          def as_body_list(items):
              return "\n".join(f"- `{c.get('path')}:{c.get('line')}` — {c.get('body','').strip()}" for c in items)
          if moved:
              body += "\n\n---\nНаходки вне диапазонов диффа:\n" + as_body_list(moved)
          def post(payload):
              open(f"{rd}/payload.json", "w").write(json.dumps(payload))
              return subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/pulls/{os.environ['PR']}/reviews",
                                     "-X", "POST", "--input", f"{rd}/payload.json"], capture_output=True, text=True)
          if os.environ.get("REPLAY"):
              body = "🔁 Реплей-прогон (замер стоимости, workflow_dispatch) — не новый раунд ревью.\n\n" + body
          payload = {"event": "COMMENT", "body": body}
          if good:
              payload["comments"] = [{"path": c["path"], "line": c["line"], "side": c.get("side", "RIGHT"), "body": c["body"]} for c in good]
          r = post(payload)
          if r.returncode and good:
              print("::warning::POST with inlines failed, publishing everything in the body:", r.stderr[:500])
              r = post({"event": "COMMENT", "body": body + "\n\n---\nИнлайны (fallback):\n" + as_body_list(good)})
          if r.returncode:
              print("::error::review publication failed:", r.stderr[:1000]); sys.exit(1)
          print("review published")
          PY

      - name: Post journal observation
        if: always()
        # The journal is non-critical: a GitHub failure on this step must not paint the job red (run 37520167275 —
        # GraphQL "Something went wrong" after a successful review publication). Three attempts, then a warning.
        continue-on-error: true
        env:
          RUN_OUT: ${{ steps.prep.outputs.out }}
          GH_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN || github.token }}
        shell: bash
        run: |
          f="$RUN_OUT/95-journal.md"
          [ -f "$f" ] || { echo "no observations"; exit 0; }
          # Run marker: a GitHub error does not guarantee that addComment was not applied —
          # before a retry we look for the marker in recent comments so as not to post a duplicate.
          marker="<!-- run ${GITHUB_RUN_ID} -->"
          printf '\n%s\n' "$marker" >> "$f"
          posted() { gh api "repos/OmnisGM-App/claude-plugins/issues/1/comments?per_page=10&sort=created&direction=desc" --jq '.[].body' 2>/dev/null | grep -qF "$marker"; }
          for i in 1 2 3; do
            [ "$i" -gt 1 ] && posted && { echo "comment already posted (attempt $((i-1)))"; exit 0; }
            gh issue comment 1 --repo OmnisGM-App/claude-plugins --body-file "$f" && exit 0
            [ "$i" -lt 3 ] && { echo "attempt $i failed, pausing"; sleep $((i * 10)); }
          done
          echo "::group::Journal that could not be sent"; cat "$f"; echo "::endgroup::"
          echo "::warning::journal not sent after 3 attempts — the text is in the log of this step"
          exit 1

      - name: Dump execution transcript (debug)
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || { echo "no $f"; exit 0; }
          python3 - "$f" <<'PYEOF'
          import json, sys
          from collections import defaultdict
          msgs = json.load(open(sys.argv[1]))
          # v2.37: attribution per agent — Task dispatch id → label; agent messages carry parent_tool_use_id.
          label, stat = {}, defaultdict(lambda: {"calls": 0, "denied": 0, "in": 0, "out": 0, "cache": 0})
          for m in msgs:
              if m.get("type") == "assistant":
                  for c in m.get("message", {}).get("content", []):
                      if c.get("type") == "tool_use" and c.get("name") in ("Agent", "Task"):
                          label[c.get("id")] = f"{(c.get('input') or {}).get('description', '?')} [{(c.get('input') or {}).get('model', '-')}]"
          for m in msgs:
              who = label.get(m.get("parent_tool_use_id"), "main loop")
              t = m.get("type")
              if t == "assistant":
                  u = m.get("message", {}).get("usage") or {}
                  stat[who]["in"] += int(u.get("input_tokens") or 0); stat[who]["out"] += int(u.get("output_tokens") or 0)
                  stat[who]["cache"] += int(u.get("cache_read_input_tokens") or 0) + int(u.get("cache_creation_input_tokens") or 0)
                  stat[who]["calls"] += sum(1 for c in m.get("message", {}).get("content", []) if c.get("type") == "tool_use")
              elif t == "user":
                  stat[who]["denied"] += sum(1 for c in m.get("message", {}).get("content", []) if isinstance(c, dict) and c.get("type") == "tool_result" and c.get("is_error"))
          print("=== PER AGENT: calls / denied / input / output / cache tokens")
          for who, s in sorted(stat.items(), key=lambda kv: -(kv[1]["in"] + kv[1]["cache"])):
              print(f"  {who:45s} {s['calls']:4d} {s['denied']:3d} {s['in']:9d} {s['out']:8d} {s['cache']:10d}")
          print("=== CHRONICLE")
          for m in msgs:
              t = m.get("type")
              # v2.41: the owner of every chronicle line (audit 8, [7]) — parallel agents are no longer interleaved.
              who = label.get(m.get("parent_tool_use_id"), "main loop").split(" [")[0]
              if t == "assistant":
                  for c in m.get("message", {}).get("content", []):
                      if c.get("type") == "text" and c.get("text", "").strip():
                          print(f"--- [{who}] ASSISTANT TEXT:\n{c['text'][:1500]}")
                      elif c.get("type") == "tool_use":
                          inp = c.get("input", {})
                          if c.get("name") in ("Agent", "Task"):
                              # v2.29: the dispatch model is visible in the dump (model routing measurement)
                              print(f"[{who}] TOOL {c.get('name')} model={inp.get('model', '-')} {inp.get('description', '')!r}: {str(inp.get('prompt', ''))[:120]!r}")
                          else:
                              print(f"[{who}] TOOL {c.get('name')}: {json.dumps(inp, ensure_ascii=False)[:220]}")
              elif t == "user":
                  for c in m.get("message", {}).get("content", []):
                      if isinstance(c, dict) and c.get("type") == "tool_result" and c.get("is_error"):
                          body = c.get("content")
                          if isinstance(body, list):
                              body = " ".join(x.get("text", "") for x in body if isinstance(x, dict))
                          print(f"  !! [{who}] DENIED/ERROR: {str(body)[:300]}")
          PYEOF

      # v2.24: on a persistent self-hosted runner nobody deleted the agent sandboxes (~0.5 GB each,
      # node_modules inside) — 189 of them in two months, ENOSPC on both
      # runners on 2026-09-15. We wipe everything the run left in /tmp, on any outcome
      # (except cancellation — the start of the next run picks that up). On ubuntu-latest — no-op.
      - name: Clean up runner scratch (self-hosted)
        if: always()
        shell: bash
        env:
          RUN_OUT: ${{ steps.prep.outputs.out }}
        run: |
          [ -n "$RUN_OUT" ] && rm -rf "$RUN_OUT"
          rm -rf /tmp/wt /tmp/*-sandbox /tmp/*-src.tar /tmp/*-nm.tar

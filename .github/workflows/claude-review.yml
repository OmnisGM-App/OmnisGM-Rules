name: Claude auto-review

# КОПИЯ единого шаблона: источник правды — OmnisGM-App/claude-plugins
# .github/workflows/claude-review.yml (reusable). На Free-плане GitHub не даёт звать
# private reusable из другой репы (проверено экспериментом 2026-09-06: same-repo ок,
# cross-repo startup_failure) — потому в репах живут копии; с Team-планом копию можно
# заменить тонким вызовом `uses: …@master` + `secrets: inherit`.

# Авто-ревью каждого коммита PR (#443-процесс, скилл omnisgm-review из плагина omnisgm).
# Новый пуш в PR отменяет незаконченное ревью и запускает свежее (concurrency ниже).
# Работает на личной подписке владельца: CLAUDE_CODE_OAUTH_TOKEN из `claude setup-token`.
on:
  pull_request:
    # edited — ради ретаргета base: когда первый PR цепочки вливается, GitHub переключает
    # base следующего на default-ветку, и он получает своё ревью (фильтр в if ниже отсекает
    # правки заголовка/описания). closed — трюк: ран в той же concurrency-группе отменяет
    # идущее ревью при мёрже/закрытии PR и сам завершается скипом.
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]

concurrency:
  # Один прогон на PR: новый коммит (или closed) отменяет текущее ревью. Событие edited БЕЗ
  # смены base уходит в отдельную группу-пустышку: иначе правка описания PR отменяла живое
  # ревью, а её собственная джоба скипалась (случай Rules#300).
  group: claude-review-${{ github.event.pull_request.number }}${{ (github.event.action == 'edited' && !github.event.changes.base) && '-noop' || '' }}
  cancel-in-progress: true

jobs:
  review:
    # Ревьюим только PR в default-ветку (dev/master/main — у каждой репы своя): стек-PR
    # дождётся ретаргета base после вливания первого в цепочке. Драфты и dependabot — скип.
    # closed не ревьюится (он только отменяет группу); edited — только смена base.
    if: >-
      github.event.action != 'closed' &&
      (github.event.action != 'edited' || github.event.changes.base) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # Полная история: ревью сверяет опоры по базовой ветке (git diff base...head).
          fetch-depth: 0

      # Самодостаточность на self-hosted: Node 22 (jsdom/undici требуют >=22)
      # и gh CLI (на self-hosted его нет в PATH). На ubuntu-latest оба шага
      # почти no-op: node ставится из кэша, gh уже есть.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure gh CLI in PATH
        shell: bash
        run: |
          command -v gh >/dev/null && { gh --version | head -1; exit 0; }
          v=$(curl -s https://api.github.com/repos/cli/cli/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)
          case "$(uname -m)" in x86_64) a=amd64;; aarch64|arm64) a=arm64;; *) echo "нет сборки gh для $(uname -m)"; exit 1;; esac
          curl -sL "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_${a}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_${a}/bin" >> "$GITHUB_PATH"

      # Экономия ходов Клода: контекст PR снимается скриптом ДО старта (аналог
      # fetch_pr.sh локального конвейера) — Клод начинает сразу с чтения файлов.
      - name: Prepare review context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
        run: |
          # self-hosted раннер персистентен: артефакты прошлого прогона в /tmp сбивают
          # ревьюера («всё уже опубликовано» на старую голову — случай Table#529).
          rm -rf /tmp/review /tmp/wt
          mkdir -p /tmp/review
          gh pr view "$PR" --repo "$REPO" --json number,title,body,baseRefName,headRefOid,additions,deletions,changedFiles --jq '"# PR #\(.number): \(.title)\n\nголова: \(.headRefOid) | base: \(.baseRefName) | +\(.additions) -\(.deletions) | файлов: \(.changedFiles)\n\n\(.body)"' > /tmp/review/00-pr.md
          git diff "origin/${BASE}...HEAD" > /tmp/review/01-diff.patch
          gh pr view "$PR" --repo "$REPO" --json comments,reviews --jq '([.comments[] | "--- коммент \(.author.login) \(.createdAt)\n\(.body)\n"] + [.reviews[] | select(.body != "") | "--- ревью \(.author.login) \(.state) \(.submittedAt)\n\(.body)\n"]) | join("\n")' > /tmp/review/02-comments.md || true
          git diff --name-status "origin/${BASE}...HEAD" > /tmp/review/04-files.txt
          for n in $(grep -oE '#[0-9]+' /tmp/review/00-pr.md | tr -d '#' | sort -un | head -5); do
            [ "$n" = "$PR" ] && continue
            gh issue view "$n" --repo "$REPO" --json number,title,body,state,comments --jq '"# Ишья #\(.number) (\(.state)): \(.title)\n\n\(.body)\n\n" + ([.comments[] | "--- коммент \(.author.login)\n\(.body)\n\n"] | join(""))' > "/tmp/review/03-issue-$n.md" 2>/dev/null || rm -f "/tmp/review/03-issue-$n.md"
          done
          ls -la /tmp/review/ && wc -l /tmp/review/01-diff.patch

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        env:
          GH_PLUGINS_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: false
          # Маркетплейс приватный — клонится fine-grained PAT-ом (contents: read
          # на OmnisGM-App/claude-plugins); секрет в URL маскируется логами Actions.
          plugin_marketplaces: |
            https://x-access-token:${{ secrets.CLAUDE_PLUGINS_TOKEN }}@github.com/OmnisGM-App/claude-plugins.git
          plugins: |
            omnisgm@omnisgm
          claude_args: |
            --max-turns 200
            --add-dir /tmp
            --allowedTools "Task,Read,Write,Edit,Glob,Grep,Bash(echo:*),Bash(sed:*),Bash(awk:*),Bash(cut:*),Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(grep:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(python3:*),Bash(diff:*),Bash(sort:*),Bash(uniq:*),Bash(find:*),Bash(npm ci:*),Bash(npx vitest:*),Bash(npx tsc:*),Bash(node:*),Bash(mkdir:*),Bash(cp:*),Bash(tar:*)"
          prompt: |
            Ты — ГЛАВНЫЙ ЦИКЛ мультиагентного CI-ревью PR #${{ github.event.pull_request.number }}
            в ${{ github.repository }}. Работа строится по скиллу omnisgm-review установленного
            плагина omnisgm: найди его каталог (`ls ~/.claude/plugins/`; внутри —
            skills/omnisgm-review/) и прочитай инструментом Read по абсолютным путям (не Bash
            cat) ДВА файла: SKILL.md и references/triage.md. Монолитного references/agents.md
            больше нет — промты лежат по файлам в references/agents/, их читает САМ агент,
            ты их не читаешь и не вкладываешь в диспатч.

            КОНВЕЙЕР (адаптация мультиагентного прогона скилла к CI):
            0. Если в репе есть frontend/package.json или свои юнит-тесты — поставь
               зависимости ОДИН раз (`npm ci` в нужной папке) до запуска агентов, чтобы им
               были доступны tsc/vitest; упало — работай без юнит-прогонов, отметь в шапке.
            1. Контекст УЖЕ подготовлен шагом workflow в /tmp/review/: 00-pr.md (описание и
               голова PR), 01-diff.patch (полный дифф), 02-comments.md (комменты и прошлые
               ревью), 03-issue-*.md (упомянутые ишьи), 04-files.txt. НЕ добывай это заново
               через gh — прочитай 00-pr.md и 01-diff.patch и сразу запускай агентов; gh
               оставь для точечных уточнений и публикации.
            2. ТРИАЖ СОСТАВА по references/triage.md (вход: 00-pr.md + 04-files.txt,
               дифф целиком не читай — точечные фрагменты по файлу при сомнении):
               A, C, F — всегда; B/D/E/G/H — по показаниям, сомнение = включить; пропуски
               назови в шапке ревью одной строкой. Выбранных субагентов Task запускай
               ПАРАЛЛЕЛЬНО (одним сообщением), каждый с model: opus. Диспатч каждому — три
               строки, промты текстом НЕ вкладывать: «Ты агент {key}. Прочитай
               <каталог-скилла>/references/agents/_header.md, затем …/agents/{key}.md.
               CI-шапка ниже. ПРОГОН: OUT=/tmp/review HEADREF=… REPO_DIR=$GITHUB_WORKSPACE».
               Результаты — /tmp/review/1?-*.md; возврат агента в диалог — короткий
               (контракт в _header.md).
               ⚠️ ЖЕЛЕЗНОЕ ПРАВИЛО ОЖИДАНИЯ (нарушалось дважды — прогон умирал без ревью):
               в headless-CI завершение твоего хода = конец прогона; никакие «уведомления»
               до тебя не дойдут. Поэтому ЗАПРЕЩЕНО: ScheduleWakeup, run_in_background
               (фоновые Bash-задачи), и любой ход, оканчивающийся словами «жду/ожидаю».
               Ожидание агентов — ТОЛЬКО повторными ОБЫЧНЫМИ (блокирующими) вызовами
               `python3 -c "import time,glob; time.sleep(90); print(sorted(glob.glob('/tmp/review/1*.md')))"`
               один за другим, пока не появятся все отчёты (суммарно ~25 минут — дальше
               работай с тем, что есть). Между опросами можно читать уже готовые отчёты.
            3. Валидатор-скептик (Task, model: opus, промт references/agents/v-validator.md): опровергает каждую находку по
               рабочей копии, вердикты CONFIRMED/REFUTED/PLAUSIBLE, дубли слить →
               /tmp/review/80-validation.md. Находок после слияния больше ~15 — ДВА
               валидатора параллельно, находки пополам (правило скилла).
            3б. ЛИЧНАЯ ПЕРЕПРОВЕРКА: каждую ❗ из CONFIRMED перепроверь САМ — чтением кода
               и, где возможно, прогоном; агентское CONFIRMED ≠ твоё. Не подтвердилась —
               понизь или выкинь, с пометкой в журнал.
            4. ТЕЛО РЕВЬЮ — ЖЁСТКИЙ МИНИМАЛИЗМ (требование владельца: только находки,
               не «анализ раунда»). Тело состоит РОВНО из:
               (а) одна строка вердикта: голова, счёт находок по тяжестям, «+N инлайнов»,
                   пропуски триажа;
               (б) если есть находки БЕЗ привязки к строке диффа — маркированный список:
                   строка на находку (тяжесть + суть), деталь вторым уровнем кратко.
               Нет находок — тело ровно: «Находок нет. Голова <sha>, агентов: N.»
               (одиночное/тривиальное ревью без агентов — ровно: «Находок нет.
               Голова <sha>, одиночное ревью.»). После точки НИЧЕГО не дописывать:
               ни что и как проверено, ни почему дифф тривиален, ни что осталось
               на месте — шаблонная строка и есть всё тело.
               Фикс-раунд — тело ровно: «Находок нет. Голова <sha>, фикс-раунд после
               <sha>: закрыты все N находок прошлого ревью.» (незакрытые — списком по
               правилу (б)); КАК перепроверялось — не писать, даже одной фразой.
               ЗАПРЕЩЕНО в теле: пересказ диффа, анализ раунда/коммитов, методология и
               «что проверено», похвалы, рассказ о конвейере (исключение: ОДНА строка при
               деградации), «Гейт» длиннее одной строки. Находка на строку диффа — ТОЛЬКО
               инлайном с полным текстом (тяжесть, доказательство, почему, предложение),
               в теле не дублируется; REFUTED не публикуется.
            5. РЕЗУЛЬТАТ — ФАЙЛЫ, НЕ ПУБЛИКАЦИЯ. Ты НЕ постишь в GitHub ничего.
               Обязательный выход: /tmp/review/90-final-review.md (тело по п.4; нет находок —
               ровно шаблонная строка из п.4 без продолжений) и /tmp/review/90-inline.json
               (JSON-массив [{"path","line","side","body"}]; пустой [] — если инлайнов нет).
               Публикует СЛЕДУЮЩИЙ ШАГ workflow одним атомарным POST; инлайны вне диапазонов
               диффа он сам перенесёт в тело. Прогон без 90-final-review.md — красный.
               Наблюдение для журнала улучшений (если есть) — файлом /tmp/review/95-journal.md
               (его тоже постит workflow-шаг, сам не пости).

            CI-ШАПКА для каждого субагента (вместо локальной шапки agents.md):
            - Рабочая копия: $GITHUB_WORKSPACE (ветка PR уже вычекнута, origin/${{ github.base_ref }} доступен).
              Опоры проверяй грепом и чтением файлов. НЕ переключать ветки, не писать в git.
            - Прогоны РАЗРЕШЕНЫ (максимально близко к локальному конвейеру): python3-гейты
              из .github/scripts, tsc --noEmit, юнит-тесты (vitest run) — если node_modules
              поставлены главным циклом. МУТАЦИОННОЕ ТЕСТИРОВАНИЕ приветствуется: копия
              дерева в /tmp (`cp -r`/`git archive`), мутация там, прогон в ОБЕ стороны;
              рабочую копию $GITHUB_WORKSPACE не мутировать. ЗАПРЕЩЕНО: эмуляторы,
              Playwright/браузеры, пиксельные кадры, деплой, сеть кроме gh — эти классы
              честно помечай «не проверялось в CI». На self-hosted раннере: чужие процессы
              НЕ убивать, вне work-каталога и /tmp НЕ писать, занятые порты не расчищать.
            - Гигиена команд (песочница CI режет иначе): НЕ использовать `cd` (вместо него
              git -C / npm --prefix / tar -C / абсолютные пути); `>`/`tee`-редиректы и
              heredoc НЕДОСТУПНЫ ВОВСЕ (режутся песочницей) — файлы писать инструментом
              Write или python3 (open().write(), subprocess); не вкладывать `$(…)`/`${…}`
              в команды (режется как обфускация).
            - Каждая находка: доказательство (файл:строка / вывод), тяжесть (❗/среднее/ремарка),
              уверенность, «внесено диффом / пре-существует». НЕ находки: пре-существующее,
              вкусовое, «потенциальное» без конкретного входа, ловимое линтером.
            - Результат — файл /tmp/review/NN-key.md; нет находок — «чисто» + что проверил.

            ФАЙЛ РЕВЬЮ ОБЯЗАТЕЛЕН: прогон без /tmp/review/90-final-review.md = провал
            (шаг публикации упадёт красным). Если конвейер деградировал (инструмент
            недоступен, агенты не поднялись, лимит ходов близко) — переходи на одиночный
            проход и запиши то, что есть, с одной строкой оговорки. Не завершай работу молча.

            ЖЁСТКИЕ РАМКИ: НЕ одобрять (no APPROVE), НЕ давать LGTM, НЕ мёржить, НЕ править код —
            финальный гейт за живой сессией владельца. Пиши по-русски. Если дифф тривиален
            (типо-правка, ≤5 строк без логики) — конвейер не разворачивай: одиночное ревью
            одним проходом, честно скажи это в шапке-вердикте.


      - name: Publish review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          rd = "/tmp/review"
          bf = f"{rd}/90-final-review.md"
          if not os.path.exists(bf):
              print("::error::Клод не сформировал 90-final-review.md — ревью не опубликовано")
              sys.exit(1)
          body = open(bf).read().strip()
          try:
              inl = json.load(open(f"{rd}/90-inline.json"))
              assert isinstance(inl, list)
          except Exception:
              inl = []
          # валидные номера строк из диффа: RIGHT — после-версия, LEFT — до-версия
          right, left, cur = {}, {}, None
          for ln in open(f"{rd}/01-diff.patch", encoding="utf-8", errors="replace"):
              m = re.match(r"\+\+\+ b/(.*)", ln)
              if m:
                  cur = m.group(1).strip(); right.setdefault(cur, set()); left.setdefault(cur, set()); continue
              m = re.match(r"@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", ln)
              if m and cur:
                  a, b = int(m.group(1)), int(m.group(2) or 1)
                  c, d = int(m.group(3)), int(m.group(4) or 1)
                  left[cur].update(range(a, a + b)); right[cur].update(range(c, c + d))
          good, moved = [], []
          for cm in inl:
              p_, l_, side = cm.get("path"), cm.get("line"), (cm.get("side") or "RIGHT")
              ok = (side == "RIGHT" and l_ in right.get(p_, ())) or (side == "LEFT" and l_ in left.get(p_, ()))
              (good if ok else moved).append(cm)
          def as_body_list(items):
              return "\n".join(f"- `{c.get('path')}:{c.get('line')}` — {c.get('body','').strip()}" for c in items)
          if moved:
              body += "\n\n---\nНаходки вне диапазонов диффа:\n" + as_body_list(moved)
          def post(payload):
              open("/tmp/payload.json", "w").write(json.dumps(payload))
              return subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/pulls/{os.environ['PR']}/reviews",
                                     "-X", "POST", "--input", "/tmp/payload.json"], capture_output=True, text=True)
          payload = {"event": "COMMENT", "body": body}
          if good:
              payload["comments"] = [{"path": c["path"], "line": c["line"], "side": c.get("side", "RIGHT"), "body": c["body"]} for c in good]
          r = post(payload)
          if r.returncode and good:
              print("::warning::POST с инлайнами упал, публикую всё в теле:", r.stderr[:500])
              r = post({"event": "COMMENT", "body": body + "\n\n---\nИнлайны (fallback):\n" + as_body_list(good)})
          if r.returncode:
              print("::error::публикация ревью не удалась:", r.stderr[:1000]); sys.exit(1)
          print("ревью опубликовано")
          PY

      - name: Post journal observation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN }}
        shell: bash
        run: |
          [ -f /tmp/review/95-journal.md ] || { echo "наблюдений нет"; exit 0; }
          gh issue comment 1 --repo OmnisGM-App/claude-plugins --body-file /tmp/review/95-journal.md

      - name: Dump execution transcript (debug)
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || { echo "нет $f"; exit 0; }
          python3 - "$f" <<'PYEOF'
          import json, sys
          msgs = json.load(open(sys.argv[1]))
          for m in msgs:
              t = m.get("type")
              if t == "assistant":
                  for c in m.get("message", {}).get("content", []):
                      if c.get("type") == "text" and c.get("text", "").strip():
                          print(f"--- ASSISTANT TEXT:\n{c['text'][:1500]}")
                      elif c.get("type") == "tool_use":
                          print(f"TOOL {c.get('name')}: {json.dumps(c.get('input', {}), ensure_ascii=False)[:220]}")
              elif t == "user":
                  for c in m.get("message", {}).get("content", []):
                      if isinstance(c, dict) and c.get("type") == "tool_result" and c.get("is_error"):
                          body = c.get("content")
                          if isinstance(body, list):
                              body = " ".join(x.get("text", "") for x in body if isinstance(x, dict))
                          print(f"  !! DENIED/ERROR: {str(body)[:300]}")
          PYEOF

name: Claude auto-review

# КОПИЯ единого шаблона: источник правды — OmnisGM-App/claude-plugins
# .github/workflows/claude-review.yml (reusable). На Free-плане GitHub не даёт звать
# private reusable из другой репы (проверено экспериментом 2026-09-06: same-repo ок,
# cross-repo startup_failure) — потому в репах живут копии; с Team-планом копию можно
# заменить тонким вызовом `uses: …@master` + `secrets: inherit`.

# Авто-ревью каждого коммита PR (#443-процесс, скилл omnisgm-review из плагина omnisgm).
# Новый пуш в PR отменяет незаконченное ревью и запускает свежее (concurrency ниже).
# Работает на личной подписке владельца: CLAUDE_CODE_OAUTH_TOKEN из `claude setup-token`.
# v2.27 (этап 1 плана экономии токенов, 2026-09-16): REPO_DIR — `${{ github.workspace }}`
# (буквальный `$GITHUB_WORKSPACE` не раскрывался: 6 отказов подряд в run 35097394123);
# `--model opus` явно; `npm run test:*` в allowlist (гейты test:dice/test:rules/test:css);
# путь плагина в промт из шага Prepare (Glob — фолбэк). Хуки плагина (SubagentStop,
# PreToolUse) приезжают с плагином 1.7.0 сами.
# v2.31 (2026-09-22): вход `plugin_ref` у workflow_dispatch — замер ветки плагина ДО мёржа в
# master: клон маркетплейса на этой ветке кладётся в $RUNNER_TEMP и отдаётся action'у
# ЛОКАЛЬНЫМ ПУТЁМ (plugin_marketplaces принимает путь), путь скилла в промт — оттуда же.
# Пусто (и любое событие PR) — прежний клон master по URL.
# v2.30: allowlist `Bash(npm run:*)` вместо `npm run test:*` — двоеточие в правиле ломало
# матч, `npm run test:css` резался (реплей 35112973775); build/lint агентам режет хук плагина.
# v2.29: дамп транскрипта печатает model диспатча Agent. Плагин 1.7.2: хук-подсказчик больше
# не режет `npm ci` главному циклу (реплей 35110978839 прошёл без node_modules).
# v2.28: workflow_dispatch с номером PR — реплей-прогон на любом (в т.ч. смёрженном) PR для
# замера стоимости: Prepare воссоздаёт merge-коммит из головы PR и родителя мёржа, тело
# ревью помечается «реплей». Условия PR-события на dispatch не действуют.
# v2.26: поиск каталога плагина — Glob, не ls (ls ~/.claude/plugins блокируется политикой).
# v2.25: CLAUDE_PLUGINS_TOKEN (fine-grained PAT на claude-plugins) нужен продуктовым репам —
# клонировать приватный маркетплейс и писать журнал в claude-plugins#1. В самой репе
# claude-plugins секрета нет и не нужно: github.token читает свою репу и пишет в свои ишьи,
# поэтому везде `secrets.CLAUDE_PLUGINS_TOKEN || github.token` (пустой секрет → фолбэк).
# До этого все раны ревью в claude-plugins падали «Invalid username or token» (7/14/16.09).
on:
  pull_request:
    # БЕЗ edited (2026-09-12): правка описания/заголовка PR гоняла скип-джобу, и её серый
    # «Skipped» затирал зелёный чек ревью на активном PR (сбивало с толку). Цена отказа —
    # stacked-PR после ретаргета base не отревьюится сам, ждёт пуша/reopen (редкий случай).
    # closed — трюк: ран в той же concurrency-группе отменяет идущее ревью при мёрже/закрытии
    # PR и сам завершается скипом (серый только на уже закрытом PR — там он не мешает).
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Номер PR для реплей-прогона (можно смёрженный)'
        required: true
        type: string
      plugin_ref:
        description: 'Ветка/тег claude-plugins для замера (пусто = master)'
        required: false
        type: string
        default: ''

concurrency:
  # Один прогон на PR: новый коммит (или closed) отменяет текущее ревью.
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Ревьюим только PR в default-ветку (dev/master/main — у каждой репы своя): стек-PR
    # дождётся пуша после ретаргета base. Драфты и dependabot — скип. closed не ревьюится
    # (он только отменяет группу).
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch )
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          # Полная история: ревью сверяет опоры по базовой ветке (git diff base...head).
          fetch-depth: 0

      # Самодостаточность на self-hosted: Node 22 (jsdom/undici требуют >=22)
      # и gh CLI (на self-hosted его нет в PATH). На ubuntu-latest оба шага
      # почти no-op: node ставится из кэша, gh уже есть.
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ensure gh CLI in PATH
        shell: bash
        run: |
          command -v gh >/dev/null && { gh --version | head -1; exit 0; }
          v=$(curl -s https://api.github.com/repos/cli/cli/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)
          case "$(uname -m)" in x86_64) a=amd64;; aarch64|arm64) a=arm64;; *) echo "нет сборки gh для $(uname -m)"; exit 1;; esac
          curl -sL "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_${a}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_${a}/bin" >> "$GITHUB_PATH"

      # Экономия ходов Клода: контекст PR снимается скриптом ДО старта (аналог
      # fetch_pr.sh локального конвейера) — Клод начинает сразу с чтения файлов.
      - name: Prepare review context
        id: prep
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEADREF: ${{ github.head_ref }}
          REPLAY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          if [ -n "$REPLAY" ]; then
            # Реплей: рабочая копия = default branch; воссоздаём то, что даёт событие PR —
            # merge-коммит с головой PR вторым родителем, база = родитель мёржа (смёрженный PR)
            # либо живая base-ветка. Имена веток кладём в remote-refs, чтобы `origin/<base>` и
            # `origin/<headref>` из ci-pipeline.md работали как обычно.
            read -r headref baseref merged headsha < <(gh pr view "$PR" --repo "$REPO" --json headRefName,baseRefName,mergeCommit,headRefOid --jq '"\(.headRefName) \(.baseRefName) \(.mergeCommit.oid // "-") \(.headRefOid)"')
            git fetch -q origin "refs/pull/$PR/head:refs/remotes/origin/$headref"
            if [ "$merged" != "-" ]; then basesha=$(git rev-parse "$merged^"); else basesha=$(git rev-parse "origin/$baseref"); fi
            git update-ref refs/remotes/origin/replay-base "$basesha"
            git -c user.email=ci@omnisgm -c user.name=replay checkout -q "$basesha"
            git -c user.email=ci@omnisgm -c user.name=replay merge -q --no-ff --no-edit "origin/$headref"
            BASE=replay-base; HEADREF=$headref
            echo "реплей PR #$PR: голова $headsha, база $basesha ($baseref), merged=$merged"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"; echo "headref=$HEADREF" >> "$GITHUB_OUTPUT"; echo "replay=$REPLAY" >> "$GITHUB_OUTPUT"
          # self-hosted раннер персистентен: артефакты прошлого прогона в /tmp сбивают
          # ревьюера («всё уже опубликовано» на старую голову — случай Table#529).
          # v2.24: плюс хвосты песочниц агентов — отменённый ран (cancel-in-progress)
          # финальный шаг очистки не выполняет, поэтому чистим и на старте. Глобы
          # /tmp/*-sandbox и *.tar — наследие промта до 1.6.13 (песочницы в голом /tmp
          # забили диск обоих раннеров, 2026-09-15); сейчас всё живёт под /tmp/review.
          rm -rf /tmp/review /tmp/wt /tmp/*-sandbox /tmp/*-src.tar /tmp/*-nm.tar
          mkdir -p /tmp/review
          gh pr view "$PR" --repo "$REPO" --json number,title,body,baseRefName,headRefOid,additions,deletions,changedFiles --jq '"# PR #\(.number): \(.title)\n\nголова: \(.headRefOid) | base: \(.baseRefName) | +\(.additions) -\(.deletions) | файлов: \(.changedFiles)\n\n\(.body)"' > /tmp/review/00-pr.md
          git diff "origin/${BASE}...HEAD" > /tmp/review/01-diff.patch
          gh pr view "$PR" --repo "$REPO" --json comments,reviews --jq '([.comments[] | "--- коммент \(.author.login) \(.createdAt)\n\(.body)\n"] + [.reviews[] | select(.body != "") | "--- ревью \(.author.login) \(.state) \(.submittedAt)\n\(.body)\n"]) | join("\n")' > /tmp/review/02-pr-comments.md || true
          git diff --name-only "origin/${BASE}...HEAD" > /tmp/review/04-files.txt
          for n in $(grep -oE '#[0-9]+' /tmp/review/00-pr.md | tr -d '#' | sort -un | head -5); do
            [ "$n" = "$PR" ] && continue
            gh issue view "$n" --repo "$REPO" --json number,title,body,state,comments --jq '"# Ишья #\(.number) (\(.state)): \(.title)\n\n\(.body)\n\n" + ([.comments[] | "--- коммент \(.author.login)\n\(.body)\n\n"] | join(""))' > "/tmp/review/03-issue-$n.md" 2>/dev/null || rm -f "/tmp/review/03-issue-$n.md"
          done
          { echo "# INDEX прогона (контекст подготовлен CI)"; echo; wc -l /tmp/review/*.md /tmp/review/*.patch /tmp/review/*.txt 2>/dev/null; } > /tmp/review/INDEX.md
          ls -la /tmp/review/ && wc -l /tmp/review/01-diff.patch
          # v2.27: путь скилла для промта — action ставит плагин в ~/.claude/plugins/marketplaces/<имя>/…
          # v2.31: при plugin_ref скилл читается из локального клона ветки (см. шаг ниже).
          if [ -n "$PLUGIN_REF" ]; then
            echo "skill=$RUNNER_TEMP/omnisgm-marketplace/plugins/omnisgm/skills/omnisgm-review" >> "$GITHUB_OUTPUT"
          else
            echo "skill=$HOME/.claude/plugins/marketplaces/omnisgm/plugins/omnisgm/skills/omnisgm-review" >> "$GITHUB_OUTPUT"
          fi

      # v2.31: маркетплейс с ветки плагина — только для замера по кнопке. Клон свежий каждый ран
      # (self-hosted персистентен), токен тот же, что у URL-варианта ниже.
      - name: Checkout plugin branch (plugin_ref)
        if: ${{ inputs.plugin_ref != '' }}
        shell: bash
        env:
          GH_PLUGINS_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN || github.token }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          rm -rf "$RUNNER_TEMP/omnisgm-marketplace"
          git clone -q --depth 1 --branch "$PLUGIN_REF" "https://x-access-token:${GH_PLUGINS_TOKEN}@github.com/OmnisGM-App/claude-plugins.git" "$RUNNER_TEMP/omnisgm-marketplace"
          echo "плагин с ветки $PLUGIN_REF: $(git -C "$RUNNER_TEMP/omnisgm-marketplace" rev-parse --short HEAD), версия $(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/omnisgm-marketplace/plugins/omnisgm/.claude-plugin/plugin.json'))['version'])")"

      # v2.22: персистентный self-hosted раннер НЕ обновляет плагин — claude-code-action
      # видит «already installed» и пропускает установку, ревью идёт по древнему кэшу
      # (ран Table 34631615126 работал по 1.2.0 без ci-pipeline.md и упал без публикации).
      # Сносим состояние плагинов целиком — action ставит свежий master заново каждый ран.
      # На эфемерных ubuntu-latest каталога нет — шаг no-op.
      - name: Purge stale plugin cache (self-hosted)
        shell: bash
        run: rm -rf ~/.claude/plugins

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        env:
          GH_PLUGINS_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN || github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: false
          # Маркетплейс приватный — клонится fine-grained PAT-ом (contents: read
          # на OmnisGM-App/claude-plugins); секрет в URL маскируется логами Actions.
          # v2.31: с plugin_ref — локальный клон ветки (шаг выше), иначе URL master.
          plugin_marketplaces: ${{ inputs.plugin_ref != '' && format('{0}/omnisgm-marketplace', runner.temp) || format('https://x-access-token:{0}@github.com/OmnisGM-App/claude-plugins.git', secrets.CLAUDE_PLUGINS_TOKEN || github.token) }}
          plugins: |
            omnisgm@omnisgm
          claude_args: |
            --max-turns 200
            --model opus
            --add-dir /tmp
            --allowedTools "Task,Read,Write,Edit,Glob,Grep,Bash(echo:*),Bash(sed:*),Bash(awk:*),Bash(cut:*),Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(gh issue view:*),Bash(grep:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(python3:*),Bash(diff:*),Bash(sort:*),Bash(uniq:*),Bash(find:*),Bash(npm ci:*),Bash(npm run:*),Bash(npx vitest:*),Bash(npx tsc:*),Bash(node:*),Bash(mkdir:*),Bash(cp:*),Bash(tar:*)"
          prompt: |
            Ты — ГЛАВНЫЙ ЦИКЛ мультиагентного CI-ревью PR. Каталог скилла:
            ${{ steps.prep.outputs.skill }} — прочитай инструментом Read ДВА файла оттуда:
            references/ci-pipeline.md (весь конвейер и правила — следуй им) и
            references/triage.md (состав агентов и модели). Нет файла по этому пути —
            найди Glob `**/omnisgm-review/references/ci-pipeline.md` с path `~/.claude/plugins`
            (`ls`/`find` по этому каталогу режутся). Промты агентов лежат в
            references/agents/ — их читает САМ агент, ты не читаешь и не вкладываешь.

            ПРОГОН: PR=#${{ github.event.pull_request.number || inputs.pr }}
            REPO=${{ github.repository }} BASE=${{ steps.prep.outputs.base }}
            HEADREF=${{ steps.prep.outputs.headref }}
            REPO_DIR=${{ github.workspace }} OUT=/tmp/review

      - name: Publish review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REPLAY: ${{ steps.prep.outputs.replay }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          rd = "/tmp/review"
          # Тело ревью собирается ДЕТЕРМИНИРОВАННО из 90-verdict.json — модель тело не пишет
          # и дописать в него ничего не может (сага «много текста» v2.8/2.12/2.16 закрыта формой).
          vf, bf = f"{rd}/90-verdict.json", f"{rd}/90-final-review.md"
          try:
              inl_early = json.load(open(f"{rd}/90-inline.json"))
              assert isinstance(inl_early, list)
          except Exception:
              inl_early = None
          if os.path.exists(vf):
              v = json.load(open(vf))
              head = str(v.get("head", ""))[:7]
              c = v.get("counts") or {}
              major, med, rem = int(c.get("major") or 0), int(c.get("medium") or 0), int(c.get("remark") or 0)
              # Фактический счёт из 90-inline.json надёжнее поля verdict.json (S мог разойтись).
              inline_n = len(inl_early) if inl_early is not None else int(v.get("inline_count") or 0)
              mode = v.get("mode", "pipeline")
              total = major + med + rem
              if total == 0:
                  if mode == "fix-round":
                      body = (f"Находок нет. Голова `{head}`, фикс-раунд после `{str(v.get('prev_head',''))[:7]}`: "
                              f"закрыты все {v.get('prev_total', v.get('prev_closed', 0))} находок прошлого ревью.")
                  elif mode == "single":
                      body = f"Находок нет. Голова `{head}`, одиночное ревью."
                  else:
                      body = f"Находок нет. Голова `{head}`, агентов: {v.get('agents', 0)}."
              else:
                  parts = [f"{major} ❗"] * (major > 0) + [f"{med} средних"] * (med > 0) + [f"{rem} ремарок"] * (rem > 0)
                  hdr = f"Голова `{head}`"
                  if mode == "fix-round":
                      hdr += f", фикс-раунд после `{str(v.get('prev_head',''))[:7]}`"
                  elif mode == "single":
                      hdr += ", одиночное ревью"
                  else:
                      hdr += f", агентов: {v.get('agents', 0)}"
                      if v.get("triage_skips"):
                          hdr += f" (триаж: {v['triage_skips']})"
                  body = hdr + ". Находки: " + " / ".join(parts) + (f", +{inline_n} инлайнов." if inline_n else ".")
              # 90-body-findings.md дочитывается и при нуле находок: там живёт
              # строка-оговорка деградации одиночного прохода (контракт ci-pipeline).
              bff = f"{rd}/90-body-findings.md"
              if os.path.exists(bff):
                  body += "\n\n" + open(bff).read().strip()
          elif os.path.exists(bf):
              # Деградационный фолбэк: свободное тело одиночного прохода старого контракта.
              print("::warning::90-verdict.json нет — опубликован фолбэк 90-final-review.md (деградация контракта)")
              body = open(bf).read().strip()
          else:
              print("::error::Клод не сформировал 90-verdict.json — ревью не опубликовано")
              sys.exit(1)
          try:
              inl = json.load(open(f"{rd}/90-inline.json"))
              assert isinstance(inl, list)
          except Exception:
              inl = []
          # валидные номера строк из диффа: RIGHT — после-версия, LEFT — до-версия
          right, left, cur, oldp = {}, {}, None, None
          for ln in open(f"{rd}/01-diff.patch", encoding="utf-8", errors="replace"):
              m = re.match(r"--- a/(.*)", ln)
              if m:
                  oldp = m.group(1).strip(); continue
              m = re.match(r"\+\+\+ (?:b/(.*)|(/dev/null))", ln)
              if m:
                  # удалённый файл: "+++ /dev/null" — путь берём из "--- a/…"
                  cur = (m.group(1) or oldp or "").strip(); right.setdefault(cur, set()); left.setdefault(cur, set()); continue
              m = re.match(r"@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", ln)
              if m and cur:
                  a, b = int(m.group(1)), int(m.group(2) or 1)
                  c, d = int(m.group(3)), int(m.group(4) or 1)
                  left[cur].update(range(a, a + b)); right[cur].update(range(c, c + d))
          good, moved = [], []
          for cm in inl:
              p_, l_, side = cm.get("path"), cm.get("line"), (cm.get("side") or "RIGHT")
              ok = (side == "RIGHT" and l_ in right.get(p_, ())) or (side == "LEFT" and l_ in left.get(p_, ()))
              (good if ok else moved).append(cm)
          def as_body_list(items):
              return "\n".join(f"- `{c.get('path')}:{c.get('line')}` — {c.get('body','').strip()}" for c in items)
          if moved:
              body += "\n\n---\nНаходки вне диапазонов диффа:\n" + as_body_list(moved)
          # Честный счёт инлайнов в шапке: перенесённые в тело из «+N инлайнов» вычитаются.
          if inl and f"+{len(inl)} инлайнов" in body and len(good) != len(inl):
              body = body.replace(f"+{len(inl)} инлайнов", f"+{len(good)} инлайнов")
          def post(payload):
              open("/tmp/payload.json", "w").write(json.dumps(payload))
              return subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/pulls/{os.environ['PR']}/reviews",
                                     "-X", "POST", "--input", "/tmp/payload.json"], capture_output=True, text=True)
          if os.environ.get("REPLAY"):
              body = "🔁 Реплей-прогон (замер стоимости, workflow_dispatch) — не новый раунд ревью.\n\n" + body
          payload = {"event": "COMMENT", "body": body}
          if good:
              payload["comments"] = [{"path": c["path"], "line": c["line"], "side": c.get("side", "RIGHT"), "body": c["body"]} for c in good]
          r = post(payload)
          if r.returncode and good:
              print("::warning::POST с инлайнами упал, публикую всё в теле:", r.stderr[:500])
              r = post({"event": "COMMENT", "body": body + "\n\n---\nИнлайны (fallback):\n" + as_body_list(good)})
          if r.returncode:
              print("::error::публикация ревью не удалась:", r.stderr[:1000]); sys.exit(1)
          print("ревью опубликовано")
          PY

      - name: Post journal observation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PLUGINS_TOKEN || github.token }}
        shell: bash
        run: |
          [ -f /tmp/review/95-journal.md ] || { echo "наблюдений нет"; exit 0; }
          gh issue comment 1 --repo OmnisGM-App/claude-plugins --body-file /tmp/review/95-journal.md

      - name: Dump execution transcript (debug)
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || { echo "нет $f"; exit 0; }
          python3 - "$f" <<'PYEOF'
          import json, sys
          msgs = json.load(open(sys.argv[1]))
          for m in msgs:
              t = m.get("type")
              if t == "assistant":
                  for c in m.get("message", {}).get("content", []):
                      if c.get("type") == "text" and c.get("text", "").strip():
                          print(f"--- ASSISTANT TEXT:\n{c['text'][:1500]}")
                      elif c.get("type") == "tool_use":
                          inp = c.get("input", {})
                          if c.get("name") in ("Agent", "Task"):
                              # v2.29: модель диспатча видна в дампе (замер маршрутизации моделей)
                              print(f"TOOL {c.get('name')} model={inp.get('model', '-')} {inp.get('description', '')!r}: {str(inp.get('prompt', ''))[:120]!r}")
                          else:
                              print(f"TOOL {c.get('name')}: {json.dumps(inp, ensure_ascii=False)[:220]}")
              elif t == "user":
                  for c in m.get("message", {}).get("content", []):
                      if isinstance(c, dict) and c.get("type") == "tool_result" and c.get("is_error"):
                          body = c.get("content")
                          if isinstance(body, list):
                              body = " ".join(x.get("text", "") for x in body if isinstance(x, dict))
                          print(f"  !! DENIED/ERROR: {str(body)[:300]}")
          PYEOF

      # v2.24: на персистентном self-hosted раннере песочницы агентов (~0.5 ГБ каждая,
      # node_modules внутри) никто не удалял — 189 штук за два месяца, ENOSPC на обоих
      # раннерах 2026-09-15. Сносим всё, что ран оставил в /tmp, при любом исходе
      # (кроме отмены — её добирает старт следующего рана). На ubuntu-latest — no-op.
      - name: Clean up runner scratch (self-hosted)
        if: always()
        shell: bash
        run: rm -rf /tmp/review /tmp/wt /tmp/*-sandbox /tmp/*-src.tar /tmp/*-nm.tar

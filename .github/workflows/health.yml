name: Health check

# Наблюдатель за ПРОДОМ (issue #284). Три проверки уже были написаны и лежали в репозитории
# без единого вызывающего: `grep` по workflow был пуст, то есть регрессия конфига Cloudflare
# или заголовков жила бы до следующего ручного прогона. А регрессировать там есть чему и
# молча: правило кэша живёт в панели CF (его можно снести мимо репозитория), security-заголовки
# едут из firebase.json, но их легко перебить порядком правил, а CSP ломается ЧУЖИМИ
# изменениями — новый сторонний скрипт на эдже не спрашивает наш репозиторий.
#
# Чёрный ящик: наружу, готовыми ответами прода — ни доступа к Firebase, ни ключей развёртки.
# Адресов два: боевой https://rules.omnisgm.com и origin https://omnisgm-rules.web.app
# (второй нужен, чтобы залипшая копия заголовков на эдже не выглядела здоровьем — см. ниже).
# Единственный секрет — `secrets.GITHUB_TOKEN` в общем шаге setup: он read-only и нужен лишь
# затем, чтобы `npm ci` достал приватный @omnisgm-app/brand из GitHub Packages (ревью #300).
# Красная джоба = штатное письмо GitHub владельцу, своего вебхука не нужно.
#
# GitHub-hosted (не self-hosted): наблюдатель не должен зависеть от инфраструктуры, здоровье
# которой проверяет. Репа публичная — минуты бесплатны.

on:
  schedule:
    - cron: '0 6 * * *'   # ежедневно, 06:00 UTC — после ночных деплоев, до рабочего дня владельца
  workflow_dispatch:

concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read
  packages: read   # установка приватного @omnisgm-app/brand из GitHub Packages (npm ci)

jobs:
  health:
    name: Prod health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Проверки на curl идут ПЕРВЫМИ, до установки чего бы то ни было: им не нужны ни Node,
      # ни Playwright, а типичный отказ CI-инфраструктуры (rate-limit GitHub Packages, блип
      # apt или CDN Playwright) роняет джобу на установке — и вместе с ней утопил бы две
      # проверки, которым эта инфраструктура ни к чему (ревью #301).
      - name: Edge-кэш Cloudflare
        id: edge
        continue-on-error: true
        run: bash web/scripts/check_edge_cache.sh

      # Заголовки сверяются с ДВУХ сторон. Через боевой домен запрос идёт за Cloudflare, и
      # эдж может отдавать старую копию: при истечении TTL он ревалидирует по ETag, получает
      # 304 и оставляет ПРЕЖНИЕ заголовки (#227) — сломанный origin выглядел бы здоровым
      # годами. Поэтому второй прогон — по origin напрямую (ревью #301).
      - name: Security-заголовки (через Cloudflare)
        id: headers
        continue-on-error: true
        run: bash web/scripts/check_security_headers.sh

      - name: Security-заголовки (origin, мимо эджа)
        id: headers_origin
        continue-on-error: true
        run: bash web/scripts/check_security_headers.sh https://omnisgm-rules.web.app

      - uses: ./.github/actions/setup-web
        with:
          python-version: ''
          npm-token: ${{ secrets.GITHUB_TOKEN }}

      # Единственная проверка, которой нужен браузер: нарушения CSP пишет сам браузер, и
      # API консоли их не видит (#225). Ставим только chromium.
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Нарушения CSP на живых страницах
        id: csp
        continue-on-error: true
        working-directory: web
        run: node scripts/check_csp.mjs

      # always(): упавшая установка не должна хоронить сводку — иначе владелец получает
      # письмо «Health check failed» без единой строки о том, что на проде (ревью #301).
      # Пропущенный из-за этого шаг называется отдельно: «skipped» — не «прошло».
      - name: Итог
        if: always()
        run: |
          fail=0
          # printf, а не echo: у echo с русским текстом и «ёлочками» в одной строке с
          # подстановкой съедается байт (воспроизведено локально) — сообщение об аварии
          # обязано читаться.
          for pair in "edge-кэш:${{ steps.edge.outcome }}" \
                      "security-заголовки (эдж):${{ steps.headers.outcome }}" \
                      "security-заголовки (origin):${{ steps.headers_origin.outcome }}" \
                      "CSP:${{ steps.csp.outcome }}"; do
            name=${pair%%:*}; outcome=${pair##*:}
            case "$outcome" in
              success) ;;
              '' | skipped)
                printf '::error::Прод-проверка «%s» НЕ ВЫПОЛНЯЛАСЬ (%s) — упал шаг установки выше\n' \
                  "$name" "${outcome:-не запускалась}"
                fail=1
                ;;
              *)
                printf '::error::Прод-проверка «%s» упала (%s) — смотри её шаг выше\n' "$name" "$outcome"
                fail=1
                ;;
            esac
          done
          if [ "$fail" = 0 ]; then
            printf 'Прод здоров: эдж-кэш, заголовки (эдж и origin) и CSP в порядке.\n'
          fi
          exit $fail

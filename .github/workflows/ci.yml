name: CI

# Лёгкая проверка на PR в main: типы (astro check) + прод-сборка. E2E (Playwright) в CI
# НЕ гоняем — они тяжёлые/нестабильные на раннере; запускаются локально: npm run test:e2e.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read   # установка приватного @omnisgm-app/brand из GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — сборке нужны даты коммитов по контентным .md (#219): из них
      # datePublished/dateModified в JSON-LD. На мелком клоне истории нет, и страницы
      # остались бы без дат (дату билда вместо настоящей мы намеренно не подставляем).
      # filter: blob:none — история приезжает без старых блобов, клон остаётся быстрым.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Валидация JSON API по схеме — тем же generate_api.py, что гоняет firebase predeploy
      # при деплое (schemas.py, additionalProperties:False). Локальный prebuild зовёт генератор
      # с --no-validate (без jsonschema, чтобы dev-сборка была бездефолтной), поэтому дрейф схемы
      # (новое поле парсера не заведено в schemas.py) на PR не всплывал и ронял уже ДЕПЛОЙ (#20,
      # spell.area). Ставим python+jsonschema и валидируем здесь — раньше мёржа, а не после.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Инвариант «поле image ставим ТОЛЬКО при наличии файла» (#201). На живых данных
      # его не поймать — портрет пока есть у всех существ, поэтому проверка на синтетике.
      - name: Unit — attach_images
        run: python3 .github/scripts/test_attach_images.py

      # Шапка статблока («размер тип, мировоззрение») — единственная строка, которую
      # импорт 5.2 растерял целиком (#196): пропал Tiny, схлопнулся «Medium or Small»,
      # у роёв исчез тип. Ни markdown-валидация, ни схема JSON API этого не видят —
      # файл остаётся корректным. Поэтому сверка с эталоном, выпиленным из PDF.
      - name: Unit — шапки статблоков SRD (5.1 и 5.2)
        run: python3 .github/scripts/test_statblock_headers.py

      # Автоправки чистки после конвертации PDF: их регресс виден только на синтетике —
      # живой контент уже вычищен, и сломанный фиксер на нём ничего не изменит (#259).
      - name: Unit — восстановление структуры после конвертации
        run: python3 .claude/skills/cleanup-artifacts/test_layout_recovery.py

      # Переименование, схлопнувшееся в тождество («Ядовитая змея (ранее «Ядовитая
      # змея»)»), — следствие того, что различие EN в русском отсутствует (#197).
      # Пройдёт любую структурную проверку: строка валидна, просто бессмысленна.
      - name: Unit — переименования в конверсионных документах
        run: python3 .github/scripts/test_conversion_renames.py

      - name: Validate JSON API schema
        run: |
          pip install jsonschema
          python3 .github/scripts/generate_api.py \
            --src-root src/dnd --output-dir "$RUNNER_TEMP/api-validate"
          # Daggerheart — те же схемы (schemas.py): ловит дрейф парсеров DH на PR
          # (в т.ч. level/recall доменных карт ≠ null). rules-terms без схемы (проза).
          python3 .github/scripts/generate_api.py --game daggerheart \
            --src-root src/daggerheart --output-dir "$RUNNER_TEMP/api-validate-dh"
          # BRP — схемы skills/professions/spot-rules.
          python3 .github/scripts/generate_api.py --game brp \
            --src-root src/brp --output-dir "$RUNNER_TEMP/api-validate-brp"

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # e2e в CI не гоняем — браузеры не качаем

      # Инварианты сборки <meta description> markdown-страниц (#213): сниппет берётся из
      # вступления/структуры страницы, а не из служебной таблицы или куска CSS. На живом
      # контенте это не различить (у всех глав сегодня есть вступление) — проверка на синтетике.
      - name: Unit — page-description
        working-directory: web
        run: node scripts/test_page_description.mjs

      # Правила русского счёта проверяются на числах, а не на страницах: 11, 21 и 24 в сборке
      # просто не встречаются, а сломать их правкой хелпера легко (#240).
      - name: Unit — склонение числительных
        working-directory: web
        run: node scripts/test_plural.mjs

      # Отпечаток сборки (#255): страж свежести — единственное, что мешает прогону идти против
      # dist, собранного из кода, которого в дереве уже нет. Проверяется на игрушечном дереве
      # во временном каталоге, рабочее не трогается; сборка для теста не нужна.
      - name: Unit — отпечаток сборки
        working-directory: web
        run: node scripts/test_build_fingerprint.mjs

      # Литеральный адрес или порт сервера в e2e (#252): порт зависит от слота (Table#469), и
      # такой литерал молча перестаёт совпадать — `replace` возвращает исходную строку, а
      # `expect` вырождается в тавтологию. Проверка текстовая, e2e для неё не нужны (в CI они
      # и не гоняются).
      - name: Гейт — литеральные адреса в e2e
        working-directory: web
        run: node scripts/verify_no_hardcoded_urls.mjs

      - name: Type-check (astro check)
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        run: npm run build

      # SEO-мета по собранному dist — issue #22, этап 3. Здесь (в check-build), а не в content.yml:
      # SEO-мета генерят Astro-шаблоны (web/src), а не markdown-контент, и dist уже собран выше —
      # без второго билда. Сэмпл по одному slug на тип страницы (EN+RU): canonical/hreflang/
      # JSON-LD/title/noindex. Битая мета = красный CI.
      - name: SEO-мета по dist
        working-directory: web
        run: node scripts/verify_dist_seo.mjs

      # Количественный гейт по ВСЕМУ dist (issue #185): дубли description и длинные <title>.
      # Бюджетный, а не нулевой — разделы чиним волнами; скрипт валит CI и на ухудшении, и на
      # неопущенном бюджете после улучшения (иначе гейт перестаёт ловить регрессии).
      - name: Мета-бюджет по dist (дубли description, длина title)
        working-directory: web
        run: node scripts/verify_dist_meta_budget.mjs

      # Смоук скриптов деплоя (#175/#186): они гоняются только в deploy.yml, где поломка
      # обнаружилась бы уже после выката. Здесь проверяем, что оба отрабатывают на свежем dist
      # и находят непустой набор URL. /api/ в CI нет (его делает firebase predeploy) — скрипт
      # это переживает, поэтому список короче боевого.
      - name: Смоук скриптов деплоя (манифест IndexNow, purge-список Cloudflare)
        working-directory: web
        run: |
          set -euo pipefail
          node scripts/indexnow_manifest.mjs --out /tmp/manifest.json
          node scripts/cf_purge_urls.mjs --out /tmp/purge.txt
          grep -q 'sitemap-index.xml' /tmp/purge.txt || { echo "❌ purge-список без sitemap — сломан сбор фикс-имён"; exit 1; }
          test "$(grep -c . /tmp/purge.txt)" -ge 10

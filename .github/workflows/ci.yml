name: CI

# Лёгкая проверка на PR в main: типы (astro check) + прод-сборка. E2E (Playwright) в CI
# НЕ гоняем — они тяжёлые/нестабильные на раннере; запускаются локально: npm run test:e2e.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read   # установка приватного @omnisgm-app/brand из GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    name: Check & Build
    runs-on: ubuntu-latest
    # Потолок на случай зависшего шага: без него застрявший прогон держал бы очередь до
    # дефолтных шести часов. Обычный прогон — около двух минут (#287).
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — сборке нужны даты коммитов по контентным .md (#219): из них
      # datePublished/dateModified в JSON-LD. На мелком клоне истории нет, и страницы
      # остались бы без дат (дату билда вместо настоящей мы намеренно не подставляем).
      # filter: blob:none — история приезжает без старых блобов, клон остаётся быстрым.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Node, Python и зависимости web — одним шагом (#287). Валидация JSON API по схеме
      # ниже гоняет тот же generate_api.py, что и firebase predeploy при деплое (schemas.py,
      # additionalProperties:False): локальный prebuild зовёт генератор с --no-validate, поэтому
      # дрейф схемы (новое поле парсера не заведено в schemas.py) на PR не всплывал и ронял уже
      # ДЕПЛОЙ (#20, spell.area).
      - uses: ./.github/actions/setup-web
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}

      # Инвариант «поле image ставим ТОЛЬКО при наличии файла» (#201). На живых данных
      # его не поймать — портрет пока есть у всех существ, поэтому проверка на синтетике.
      - name: Unit — attach_images
        run: python3 .github/scripts/test_attach_images.py

      # Шапка статблока («размер тип, мировоззрение») — единственная строка, которую
      # импорт 5.2 растерял целиком (#196): пропал Tiny, схлопнулся «Medium or Small»,
      # у роёв исчез тип. Ни markdown-валидация, ни схема JSON API этого не видят —
      # файл остаётся корректным. Поэтому сверка с эталоном, выпиленным из PDF.
      - name: Unit — шапки статблоков SRD (5.1 и 5.2)
        run: python3 .github/scripts/test_statblock_headers.py

      # Остальные поля блока (КД, инициатива, хиты, скорость, навыки, чувства, языки,
      # ПО, иммунитеты, снаряжение, таблица характеристик) не сверялись ни с чем, хотя текст
      # приехал не из PDF: у 5.2 нашлось 255 расхождений — 30 инициатив, 29 ПО без бонуса
      # мастерства, 27 обобщённых «XP 0 or 10», 129 потерянных строк «Languages None».
      # У 5.1 (свои формы: спасброски отдельной строкой, иммунитеты по видам, ни инициативы,
      # ни снаряжения) — ещё 26 расхождений на 12 блоках, от спасбросков наги, уехавших в
      # соседний блок, до строки поля, записанной абзацем вместо пункта списка (#260).
      - name: Unit — поля статблоков SRD (5.1 и 5.2)
        run: python3 .github/scripts/test_statblock_fields.py

      # Форма строки типа из ВРЕЗКИ, которой не видит ни один соседний гейт: граница
      # диапазона («Huge or Smaller Construct») — её откат оставляет гейты шапок и полей
      # зелёными, врезки в JSON API не идут. Составной тип («Large Celestial, Fey, or
      # Fiend (Your Choice), Neutral») с #290 держит и гейт шапок: разрез общий, формы
      # пришпилены его таблицей самопроверок. Вторая половина шага — формы СТРОКИ
      # СКОРОСТИ: «Climb or Fly 20 ft.» (число относится к обоим режимам) и обе русские
      # формы лазанья; их откат виден только в собранном JSON API, который не читает
      # ни один гейт (#260).
      - name: Unit — разбор строки типа и скорости статблока
        run: python3 .github/scripts/test_monster_parser.py

      # Автоправки чистки после конвертации PDF: их регресс виден только на синтетике —
      # живой контент уже вычищен, и сломанный фиксер на нём ничего не изменит (#259).
      - name: Unit — восстановление структуры после конвертации
        run: python3 .claude/skills/cleanup-artifacts/test_layout_recovery.py

      # Переименование, схлопнувшееся в тождество («Ядовитая змея (ранее «Ядовитая
      # змея»)»), — следствие того, что различие EN в русском отсутствует (#197).
      # Пройдёт любую структурную проверку: строка валидна, просто бессмысленна.
      - name: Unit — переименования в конверсионных документах
        run: python3 .github/scripts/test_conversion_renames.py

      # Карта терминов для перевода собирается из словарей И ЛОГОВ, причём заголовок
      # записи лога перебивает словарь. Прозаический заголовок со стрелкой уезжает в
      # карту термином: так «Dragon» однажды стал куском предложения (#256). Саму карту
      # не гонял ни один чек — теперь гоняет.
      - name: Unit — карта терминов перевода
        run: python3 .github/scripts/test_term_map.py

      # Размер в ПРОЗЕ, три части. Первая — ФОРМЫ границы диапазона: одно EN-выражение
      # (`Large or larger`) жило в русском корпусе четырьмя формами сразу, и не ловило его
      # ничто — прозу не разбирает ни парсер, ни гейты шапок. Вторая — СЧЁТ: границу можно
      # вычистить по форме и потерять по дороге, поэтому число вхождений сверяется с
      # оригиналом пофайлово (#319). Третья — КАНОН категорий: четыре строки корпуса,
      # определяющие шесть размеров, обязаны называть их словарными терминами с прописной
      # (#321). Сплошного свода регистра тут нет сознательно — обоснование в шапке гейта.
      - name: Unit — размер в прозе — формы границы, счёт, канон категорий
        run: python3 .github/scripts/test_prose_size_bounds.py

      # Категория доспеха (#323) — другой термин, чем размер, и регистр у него ЗАВИСИТ ОТ
      # РЕДАКЦИИ, потому что зависит от оригинала: EN 5.2 пишет её с прописной сплошь (30
      # вхождений в середине фразы, строчных 0), EN 5.1 — строчной (19 против 4). Расхождение
      # не роняет ни сборку, ни парность EN↔RU (та сверяет количества строк, а не слова), так
      # что держать его может только гейт; так класс и накопился — 78 мест в 5.2.
      - name: Unit — регистр категорий доспеха по редакциям
        run: python3 .github/scripts/test_armor_category_register.py

      - name: Validate JSON API schema
        run: |
          pip install jsonschema
          python3 .github/scripts/generate_api.py \
            --src-root src/dnd --output-dir "$RUNNER_TEMP/api-validate"
          # Daggerheart — те же схемы (schemas.py): ловит дрейф парсеров DH на PR
          # (в т.ч. level/recall доменных карт ≠ null). rules-terms без схемы (проза).
          python3 .github/scripts/generate_api.py --game daggerheart \
            --src-root src/daggerheart --output-dir "$RUNNER_TEMP/api-validate-dh"
          # BRP — схемы skills/professions/spot-rules.
          python3 .github/scripts/generate_api.py --game brp \
            --src-root src/brp --output-dir "$RUNNER_TEMP/api-validate-brp"

      # Инварианты сборки <meta description> markdown-страниц (#213): сниппет берётся из
      # вступления/структуры страницы, а не из служебной таблицы или куска CSS. На живом
      # контенте это не различить (у всех глав сегодня есть вступление) — проверка на синтетике.
      - name: Unit — page-description
        working-directory: web
        run: node scripts/test_page_description.mjs

      # Правила русского счёта проверяются на числах, а не на страницах: 11, 21 и 24 в сборке
      # просто не встречаются, а сломать их правкой хелпера легко (#240).
      - name: Unit — склонение числительных
        working-directory: web
        run: node scripts/test_plural.mjs

      # Политика CSP (#325): пропажа хоста в ней не роняет ни сборку, ни e2e — она роняет чужой
      # скрипт в браузере посетителя. Так и вышло: Метрика шлёт хиты зарубежных посетителей на
      # mc.yandex.com, хоста в политике не было, и с перевода в enforce счётчик для них молчал.
      - name: Гейт — политика CSP (парность Метрики, хосты кода)
        working-directory: web
        run: node scripts/test_csp_policy.mjs

      # Выбор вида очереди картинок (#291): крон обязан сам переходить к следующему виду,
      # когда очередь текущего закрыта. На живом корпусе это состояние репозитория, а не
      # правило, поэтому проверка на синтетике; заодно страж полноты порядка видов.
      - name: Unit — выбор вида очереди картинок
        run: node scripts/test_gen_images_kind.mjs

      # Корневые агрегаторы (`npm run test:unit`, `test:unit:py`) обещают «прогнать всё как
      # CI», и обещание живёт до первого юнита, добавленного сюда мимо package.json: локальный
      # прогон остаётся зелёным, проверяя меньше. Состав сверяется в обе стороны (#283).
      - name: Гейт — агрегаторы юнитов не разошлись с CI
        run: node scripts/test_unit_agenda.mjs

      # Composite-шаг убрал копии связки setup, но не мешает завести их заново — запрет
      # на прямой actions/setup-node и требование timeout-minutes живут здесь (#287).
      - name: Гейт — связка setup и потолки времени в workflow
        run: node scripts/test_workflow_setup.mjs

      # Обратная сторона поимённого списка в tsconfig.tools.json (#304): `TS6053` ловит
      # исчезновение записи, но не появление нового скрипта — тот молча остался бы вне
      # тайпчека, а «покрытие полное» в комментарии конфига стало бы неправдой (ревью #315).
      - name: Гейт — полнота тайпчека инструментов
        run: node scripts/test_tools_scope.mjs

      # Документация про инструментарий (#296): скилл `/integrate-srd` полгода описывал правку
      # `pages.yml` и `mkdocs.yml` — файлов, снесённых вместе с движком, — и стоял фазой в
      # оркестраторах пайплайна. Удаление файла в документации ничего не ломает, поэтому
      # названный скрипт/скилл/workflow обязан существовать.
      - name: Гейт — документация ссылается на живой инструментарий
        run: node scripts/test_doc_links.mjs

      # Отпечаток сборки (#255): страж свежести — единственное, что мешает прогону идти против
      # dist, собранного из кода, которого в дереве уже нет. Проверяется на игрушечном дереве
      # во временном каталоге, рабочее не трогается; сборка для теста не нужна.
      - name: Unit — отпечаток сборки
        working-directory: web
        run: node scripts/test_build_fingerprint.mjs

      # Литеральный адрес или порт сервера в e2e (#252): порт зависит от слота (Table#469), и
      # такой литерал молча перестаёт совпадать — `replace` возвращает исходную строку, а
      # `expect` вырождается в тавтологию. Проверка текстовая, e2e для неё не нужны (в CI они
      # и не гоняются).
      - name: Гейт — литеральные адреса в e2e
        working-directory: web
        run: node scripts/verify_no_hardcoded_urls.mjs

      - name: Type-check (astro check)
        working-directory: web
        run: npm run check

      # `.mjs` не видит никто, кроме этого шага: `astro check` читает `**/*`, то есть `.ts`
      # (конфиг Playwright и e2e) он уже проверяет — заведомая ошибка типа в спеке его краснит,
      # а та же ошибка в `add_sitemap_lastmod.mjs` оставляет зелёным (проверено прогонами,
      # ревью #298). Тихие среди скриптов — `cf_purge_urls` и `indexnow_manifest`: порогов
      # осмысленности результата у них нет, сброс не того кэша и пинг не тех URL никто не
      # заметит. У `add_sitemap_lastmod` пороги свои, и tsc страхует опечатку в имени поля,
      # а не структуру (#285). С #304 сюда же входят `web/src/lib` (rehype-цепочка, решающая,
      # какой HTML получат страницы), `astro.config.mjs` и корневые `scripts/*.mjs`.
      - name: Type-check (скрипты, web/src/lib и e2e)
        working-directory: web
        run: npm run lint:tools

      - name: Build
        working-directory: web
        run: npm run build

      # SEO-мета по собранному dist — issue #22, этап 3. Здесь (в check-build), а не в content.yml:
      # SEO-мета генерят Astro-шаблоны (web/src), а не markdown-контент, и dist уже собран выше —
      # без второго билда. Сэмпл по одному slug на тип страницы (EN+RU): canonical/hreflang/
      # JSON-LD/title/noindex. Битая мета = красный CI.
      - name: SEO-мета по dist
        working-directory: web
        run: node scripts/verify_dist_seo.mjs

      # Количественный гейт по ВСЕМУ dist (issue #185): дубли description и длинные <title>.
      # Бюджетный, а не нулевой — разделы чиним волнами; скрипт валит CI и на ухудшении, и на
      # неопущенном бюджете после улучшения (иначе гейт перестаёт ловить регрессии).
      - name: Мета-бюджет по dist (дубли description, длина title)
        working-directory: web
        run: node scripts/verify_dist_meta_budget.mjs

      # Смоук скриптов деплоя (#175/#186): они гоняются только в deploy.yml, где поломка
      # обнаружилась бы уже после выката. Здесь проверяем, что оба отрабатывают на свежем dist
      # и находят непустой набор URL. /api/ в CI нет (его делает firebase predeploy) — скрипт
      # это переживает, поэтому список короче боевого.
      - name: Смоук скриптов деплоя (манифест IndexNow, purge-список Cloudflare)
        working-directory: web
        run: |
          set -euo pipefail
          node scripts/indexnow_manifest.mjs --out /tmp/manifest.json
          node scripts/cf_purge_urls.mjs --out /tmp/purge.txt
          grep -q 'sitemap-index.xml' /tmp/purge.txt || { echo "❌ purge-список без sitemap — сломан сбор фикс-имён"; exit 1; }
          test "$(grep -c . /tmp/purge.txt)" -ge 10

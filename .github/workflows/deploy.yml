name: Deploy to Firebase Hosting

# Заменяет прежний pages.yml (GitHub Pages / MkDocs). Сайт — Astro (web/), статика → Firebase
# Hosting (проект omnisgm-rules). Сборку Astro + генерацию JSON API делает firebase predeploy
# (см. firebase.json). Релизные воркфлоу (release*.yml, PDF) этим не затрагиваются.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'config/**'
      # Весь каталог: generate_api.py тянет schemas.py / config.py / parsers/** — правка любого
      # из них меняет JSON API, но раньше деплой триггерил только сам generate_api.py, поэтому
      # чинить схему/парсер приходилось ручным workflow_dispatch (грабли #20). Теперь авто-деплой.
      - '.github/scripts/**'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      full_ping:
        description: 'IndexNow: пингануть ВЕСЬ sitemap (только при смене домена/структуры URL)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read   # установка приватного @omnisgm-app/brand из GitHub Packages

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # e2e тут не гоняем — не тянем Chromium в деплой

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install API generator deps
        run: pip install jsonschema

      - name: Write service account
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # firebase deploy запускает predeploy: astro build (с VITE_FIREBASE_* из секретов) + gen API
      - name: Build & deploy
        run: npx --yes firebase-tools@latest deploy --only hosting --project omnisgm-rules --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # Astro отдаёт клиентским скриптам только PUBLIC_-переменные — gtag читает именно её (#18).
          # Значение то же (секрет не переименовываем); VITE_-строку оставляем для firebaseConfig.
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # Яндекс.Метрика (#27) — ID счётчика публичный (виден в HTML) → repo variable, не секрет.
          # Без переменной блок Метрики тихо не грузится (gated в analytics-client.ts).
          PUBLIC_METRIKA_ID: ${{ vars.PUBLIC_METRIKA_ID }}

      # Диффом сборки пользуются ДВА шага ниже — purge Cloudflare (#175) и пинг IndexNow (#186),
      # поэтому он считается один раз здесь, до них обоих. Порядок именно такой: сначала выбить
      # старое из edge-кэша, потом звать поисковик — иначе краулер придёт на закэшированную
      # прошлую версию страницы.
      #
      # Сигнатура — <title> + description + текст страницы без разметки, а не хеш файла: Astro
      # штампует хеши в имена ассетов и классов, побайтовое сравнение показывало бы «изменилось
      # всё» каждый раз. Проверено локально: пересборка без правок и правка CSS дают 0 URL,
      # правка одного файла контента — ровно 1.
      - name: Восстановить прошлый манифест IndexNow
        if: success()
        uses: actions/cache/restore@v4
        with:
          path: web/.indexnow/manifest.json
          key: indexnow-manifest-${{ github.sha }}
          restore-keys: indexnow-manifest-

      - name: Дифф сборки (изменённые и исчезнувшие URL)
        if: success()
        env:
          FULL: ${{ inputs.full_ping }}
        run: |
          set -euo pipefail
          cd web
          # Кэш кладёт файл по тому же пути, под которым его сохранили, поэтому прошлый
          # манифест приезжает как manifest.json — переименовываем, чтобы не перезаписать.
          mkdir -p .indexnow
          [ -f .indexnow/manifest.json ] && mv .indexnow/manifest.json .indexnow/prev.json || true
          # Файлы должны существовать даже когда прошлого манифеста нет: скрипт в этом случае
          # выходит раньше, а читают их шаги ниже.
          : > /tmp/urls.txt
          : > /tmp/removed.txt

          if [ "${FULL:-false}" = "true" ]; then
            grep -ohE '<loc>[^<]+</loc>' dist/sitemap-[0-9]*.xml | sed -E 's#</?loc>##g' > /tmp/urls.txt
            echo "::warning::Аварийный режим: шлём ВЕСЬ sitemap ($(wc -l < /tmp/urls.txt) URL)."
          else
            node scripts/indexnow_manifest.mjs \
              --out .indexnow/manifest.json \
              --prev .indexnow/prev.json \
              --changed /tmp/urls.txt \
              --removed /tmp/removed.txt
          fi

      # Сброс edge-кэша Cloudflare после деплоя (#175). Точечно по URL, а не «purge everything»:
      # зона одна на весь omnisgm.com, полный сброс выносит заодно кэш News и Table. Purge по
      # префиксу/хосту в Cloudflare — только на Enterprise, поэтому список URL собираем сами:
      # изменённые и исчезнувшие страницы + фикс-имена (sitemap/robots/иконки/sw) + JSON API.
      # Хэш-ассеты не нужны — новая сборка даёт новые имена.
      #
      # Порог: purge по URL идёт порциями по 30 (лимит API вне Enterprise). Когда правка задела
      # столько страниц, что порций стало бы больше PURGE_MAX_BATCHES, дешевле один раз сбросить
      # зону целиком — соседи прогреются заново, зато не ждём сотню запросов.
      # Без секретов CLOUDFLARE_* шаг тихо пропускается.
      - name: Purge Cloudflare cache
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "Cloudflare-секреты не заданы — purge пропущен."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache"
          call() {  # $1 — тело запроса
            curl -s -X POST "$api" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" --data "$1"
          }

          # Шаг сознательно без `set -e` (ошибки порций разбираем сами), поэтому падение
          # скрипта проверяем явно: иначе дальше насчитается ok=0 и шаг умрёт с сообщением
          # «не сброшено ничего» — красный, но с неверным диагнозом (ревью #192).
          node web/scripts/cf_purge_urls.mjs \
            --out /tmp/purge.txt --changed /tmp/urls.txt --removed /tmp/removed.txt \
            || { echo "❌ cf_purge_urls.mjs не отработал — purge-список не собран"; exit 1; }

          PURGE_MAX_BATCHES=40   # 40 × 30 URL = 1200 адресов, дальше выгоднее сбросить зону
          total=$(grep -c . /tmp/purge.txt || true)
          batches=$(( (total + 29) / 30 ))

          if [ "$batches" -gt "$PURGE_MAX_BATCHES" ]; then
            echo "::warning::Cloudflare: $total URL к сбросу — это $batches порций, сбрасываем зону целиком (заденет кэш News/Table, они прогреются)."
            resp=$(call '{"purge_everything":true}')
            echo "$resp" | grep -q '"success":true' \
              || { echo "❌ Cloudflare purge_everything не удался: $resp"; exit 1; }
            echo "✔ Cloudflare: зона сброшена целиком"
            exit 0
          fi

          rm -f /tmp/cf-purge-batch-*
          split -l 30 /tmp/purge.txt /tmp/cf-purge-batch-
          ok=0; bad=0
          for batch in /tmp/cf-purge-batch-*; do
            body=$(jq -R . < "$batch" | jq -sc '{files: .}')
            resp=$(call "$body")
            if echo "$resp" | grep -q '"success":true'; then
              ok=$((ok + $(grep -c . "$batch")))
            else
              bad=$((bad + 1)); echo "::warning::порция не сброшена: $resp"
            fi
          done
          # Неуспешные порции сами по себе деплой не роняют: страница доживёт до конца TTL (час).
          # А вот полный отказ — это несвежий сайт на эдже, о нём надо знать сразу.
          [ "$ok" -gt 0 ] || { echo "❌ Cloudflare: не сброшено ничего ($bad порций с ошибкой)"; exit 1; }
          echo "✔ Cloudflare: сброшено $ok из $total URL (неуспешных порций: $bad)"

      # IndexNow — стриминг ТОЛЬКО изменённых URL (#186; заведён в #17).
      #
      # Раньше слали весь sitemap на каждом деплое (5975 URL), из-за чего Bing показывал
      # рекомендацию «IndexNow is in batch mode». Теперь: манифест «URL → сигнатура содержимого»
      # кладётся в кэш, следующий деплой берёт прошлый манифест и шлёт разницу. Сам дифф
      # посчитан шагом «Дифф сборки» выше, здесь только отправка.
      - name: IndexNow ping
        id: indexnow
        if: success()
        env:
          KEY: 94c855220fc93a1e6ccdc3f67fdfbb92
          FULL: ${{ inputs.full_ping }}
        run: |
          set -euo pipefail
          host="rules.omnisgm.com"
          # Верхний предел на один прогон: массовая правка шаблона меняет сигнатуру у всех
          # страниц, и слать 6000 URL — это ровно тот batch-режим, от которого уходим.
          # Скрипт сортирует изменённые по длине пути, поэтому первыми идут хабы и классы.
          MAX=1000

          n=$(grep -c . /tmp/urls.txt || true)
          if [ "$n" -eq 0 ]; then
            echo "IndexNow: изменённых URL нет — пинг не нужен."
            echo "pinged=true" >> "$GITHUB_OUTPUT"   # менять нечего — база актуальна, сохраняем
            exit 0
          fi
          # Кап — только для обычного режима. В аварийном (full_ping) он отменял бы саму функцию:
          # флаг заведён ради смены домена/структуры URL, там нужен именно полный прогон.
          if [ "${FULL:-false}" != "true" ] && [ "$n" -gt "$MAX" ]; then
            echo "::warning::IndexNow: изменилось $n URL, шлём первые $MAX (короткие пути — хабы и классы). Остальные $((n - MAX)) найдутся обходом по sitemap."
            head -n "$MAX" /tmp/urls.txt > /tmp/urls.capped.txt && mv /tmp/urls.capped.txt /tmp/urls.txt
            n=$MAX
          fi

          # Порции по 100 URL с паузой — «streaming» в терминах рекомендации Bing.
          # Чистим хвосты прошлого прогона: при повторном запуске job (re-run) старые файлы
          # порций остались бы в /tmp и попали в цикл — счётчик отправленного врал бы, а часть
          # URL ушла бы дважды. Поймано на локальном стенде.
          rm -f /tmp/indexnow-batch-*
          split -l 100 /tmp/urls.txt /tmp/indexnow-batch-
          sent=0; failed=0
          for batch in /tmp/indexnow-batch-*; do
            jq -R . < "$batch" | jq -sc --arg h "$host" --arg k "$KEY" --arg kl "https://$host/$KEY.txt" \
              '{host:$h,key:$k,keyLocation:$kl,urlList:.}' > /tmp/indexnow.json
            code=$(curl -s -o /tmp/indexnow.resp -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow.json)
            cnt=$(grep -c . "$batch")
            case "$code" in
              200|202) sent=$((sent + cnt)); echo "  ✔ порция $cnt URL — HTTP $code";;
              *) failed=$((failed + 1)); echo "::warning::порция $cnt URL — HTTP $code: $(cat /tmp/indexnow.resp)";;
            esac
            sleep 2
          done
          echo "IndexNow: отправлено $sent из $n URL, неуспешных порций: $failed"
          # Манифест сохраняем, только если хоть что-то ушло. Шаг всегда завершается exit 0
          # (best-effort, деплой ронять нельзя), поэтому одного `if: success()` на шаге
          # сохранения мало: при 403-окне переверификации ключа или аварии API манифест
          # обновился бы, а изменения не ушли бы НИКОГДА (ревью #190).
          # Частичный успех сохраняем сознательно: повторно отправить ушедшее дешевле,
          # чем потерять неушедшее.
          if [ "$sent" -eq 0 ]; then
            echo "::warning::IndexNow: не ушла ни одна порция — манифест НЕ сохраняем, следующий деплой отправит эти URL снова."
            echo "pinged=false" >> "$GITHUB_OUTPUT"
          else
            echo "pinged=true" >> "$GITHUB_OUTPUT"
          fi
          # Пинг — best-effort уведомление ПОСЛЕ успешного деплоя: он не должен ронять ран.
          exit 0

      # Манифест сохраняем только когда пинг реально ушёл (steps.indexnow.outputs.pinged):
      # иначе следующий деплой сравнил бы свежий манифест с этим же и решил, что менять
      # нечего, — изменения потерялись бы молча. В аварийном full-режиме манифест не пишется
      # вовсе, поэтому шаг пропускается.
      - name: Сохранить манифест IndexNow
        if: success() && steps.indexnow.outputs.pinged == 'true' && inputs.full_ping != true
        uses: actions/cache/save@v4
        with:
          path: web/.indexnow/manifest.json
          key: indexnow-manifest-${{ github.sha }}

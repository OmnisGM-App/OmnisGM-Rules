name: Deploy to Firebase Hosting

# Заменяет прежний pages.yml (GitHub Pages / MkDocs). Сайт — Astro (web/), статика → Firebase
# Hosting (проект omnisgm-rules). Сборку Astro + генерацию JSON API делает firebase predeploy
# (см. firebase.json). Релизные воркфлоу (release*.yml, PDF) этим не затрагиваются.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'config/**'
      # Весь каталог: generate_api.py тянет schemas.py / config.py / parsers/** — правка любого
      # из них меняет JSON API, но раньше деплой триггерил только сам generate_api.py, поэтому
      # чинить схему/парсер приходилось ручным workflow_dispatch (грабли #20). Теперь авто-деплой.
      - '.github/scripts/**'
      - 'firebase.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # установка приватного @omnisgm-app/brand из GitHub Packages

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # e2e тут не гоняем — не тянем Chromium в деплой

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install API generator deps
        run: pip install jsonschema

      - name: Write service account
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # firebase deploy запускает predeploy: astro build (с VITE_FIREBASE_* из секретов) + gen API
      - name: Build & deploy
        run: npx --yes firebase-tools@latest deploy --only hosting --project omnisgm-rules --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # Astro отдаёт клиентским скриптам только PUBLIC_-переменные — gtag читает именно её (#18).
          # Значение то же (секрет не переименовываем); VITE_-строку оставляем для firebaseConfig.
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # Яндекс.Метрика (#27) — ID счётчика публичный (виден в HTML) → repo variable, не секрет.
          # Без переменной блок Метрики тихо не грузится (gated в analytics-client.ts).
          PUBLIC_METRIKA_ID: ${{ vars.PUBLIC_METRIKA_ID }}

      # Сброс edge-кэша Cloudflare после деплоя — точечно, фикс-имена на rules.omnisgm.com
      # (иконки/favicon/manifest/sw/og кэшируются на edge; HTML/хэш-ассеты не трогаем).
      # Без секретов CLOUDFLARE_* шаг тихо пропускается.
      - name: Purge Cloudflare cache
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare-секреты не заданы — purge пропущен."
            exit 0
          fi
          base="https://rules.omnisgm.com"
          files=$(printf '"%s",' \
            "$base/favicon.svg" "$base/favicon.ico" "$base/icon.svg" "$base/maskable.svg" \
            "$base/robots.txt" "$base/sitemap-index.xml" "$base/sitemap-0.xml" "$base/llms.txt" \
            "$base/icon-192.png" "$base/icon-512.png" \
            "$base/maskable-192.png" "$base/maskable-512.png" \
            "$base/apple-touch-icon.png" "$base/og.png" \
            "$base/manifest.webmanifest" "$base/sw.js")
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[${files%,}]}")
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || { echo "❌ Cloudflare purge не удался"; exit 1; }
          echo "✔ Cloudflare: edge-кэш фикс-файлов rules.omnisgm.com сброшен"

      # IndexNow — мгновенный пинг Bing + Яндекс о задеплоенных страницах (#17).
      # URL берём из свежесобранного web/dist/sitemap-0.xml (predeploy собрал его тем же билдом,
      # что ушёл на хостинг) — только реально существующие URL, битых не шлём. Для нового сайта
      # на первичной индексации шлём весь набор (~177 URL после исключения glossary из
      # sitemap, см. #37; лимит IndexNow — 10 000/запрос).
      # KEY — публичный по дизайну, лежит в web/public/${KEY}.txt и совпадает с этой строкой.
      #
      # ВАЖНО: это best-effort уведомление ПОСЛЕ уже успешного деплоя — оно НЕ должно ронять ран.
      # Любой не-2xx (в т.ч. 403 SiteVerificationNotCompleted при самом первом пинге, пока движок
      # не подтянул ключ-файл) → ::warning::, exit 0. Сайт от этого не страдает; следующий деплой
      # после завершения верификации вернёт 200/202.
      - name: IndexNow ping
        if: success()
        env:
          KEY: 94c855220fc93a1e6ccdc3f67fdfbb92
        run: |
          host="rules.omnisgm.com"
          urls=$(grep -ohE '<loc>[^<]+</loc>' web/dist/sitemap-[0-9]*.xml 2>/dev/null | sed -E 's#</?loc>##g')
          n=$(printf '%s\n' "$urls" | grep -c . || true)
          if [ "$n" -eq 0 ]; then echo "::warning::IndexNow: sitemap пуст — пинг пропущен."; exit 0; fi
          # Payload в файл (не в аргумент curl): при >~1500 URL строка --data "$payload"
          # перешагивает ARG_MAX → «curl: Argument list too long» (грабли #20, sitemap вырос
          # на страницы животных). --data-binary @file снимает лимит.
          printf '%s\n' "$urls" | grep . | jq -R . \
            | jq -sc --arg h "$host" --arg k "$KEY" --arg kl "https://$host/$KEY.txt" \
                '{host:$h,key:$k,keyLocation:$kl,urlList:.}' > /tmp/indexnow.json
          resp=$(curl -s -w '\n%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow.json)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s\n' "$resp" | sed '$d')
          echo "IndexNow: $n URL, HTTP $code"
          [ -n "$body" ] && echo "$body"
          case "$code" in
            200|202) echo "✔ IndexNow принял пинг ($code)";;
            403) echo "::warning::IndexNow вернул 403 (вероятно верификация ключа ещё идёт) — деплой не затронут, следующий пинг пройдёт.";;
            *)   echo "::warning::IndexNow вернул $code — пинг best-effort, деплой не затронут.";;
          esac
          exit 0
